null;\\n};\\n\\nexports.Command = Command;\\n\",\"type\":\"application/javascript\",\"module-type\":\"command\"},\"$:/core/modules/commands/clearpassword.js\":{\"title\":\"$:/core/modules/commands/clearpassword.js\",\"text\":\"/*\\\\\\ntitle: $:/core/modules/commands/clearpassword.js\\ntype: application/javascript\\nmodule-type: command\\n\\nClear password for crypto operations\\n\\n\\\\*/\\n\\n\\\"use strict\\\";\\n\\nexports.info = {\\n\\tname: \\\"clearpassword\\\",\\n\\tsynchronous: true\\n};\\n\\nvar Command = function(params,commander,callback) {\\n\\tthis.params = params;\\n\\tthis.commander = commander;\\n\\tthis.callback = callback;\\n};\\n\\nCommand.prototype.execute = function() {\\n\\t$tw.crypto.setPassword(null);\\n\\treturn null;\\n};\\n\\nexports.Command = Command;\\n\",\"type\":\"application/javascript\",\"module-type\":\"command\"},\"$:/core/modules/commands/commands.js\":{\"title\":\"$:/core/modules/commands/commands.js\",\"text\":\"/*\\\\\\ntitle: $:/core/modules/commands/commands.js\\ntype: application/javascript\\nmodule-type: command\\n\\nRuns the commands returned from a filter\\n\\n\\\\*/\\n\\n\\\"use strict\\\";\\n\\nexports.info = {\\n\\tname: \\\"commands\\\",\\n\\tsynchronous: true\\n};\\n\\nvar Command = function(params, commander) {\\n\\tthis.params = params;\\n\\tthis.commander = commander;\\n};\\n\\nCommand.prototype.execute = function() {\\n\\t// Parse the filter\\n\\tvar filter = this.params[0];\\n\\tif(!filter) {\\n\\t\\treturn \\\"No filter specified\\\";\\n\\t}\\n\\tvar commands = this.commander.wiki.filterTiddlers(filter);\\n\\tif(commands.length === 0) {\\n\\t\\treturn \\\"No tiddlers found for filter '\\\" + filter + \\\"'\\\";\\n\\t}\\n\\tthis.commander.addCommandTokens(commands);\\n\\treturn null;\\n};\\n\\nexports.Command = Command;\\n\",\"type\":\"application/javascript\",\"module-type\":\"command\"},\"$:/core/modules/commands/deletetiddlers.js\":{\"title\":\"$:/core/modules/commands/deletetiddlers.js\",\"text\":\"/*\\\\\\ntitle: $:/core/modules/commands/deletetiddlers.js\\ntype: application/javascript\\nmodule-type: command\\n\\nCommand to delete tiddlers\\n\\n\\\\*/\\n\\n\\\"use strict\\\";\\n\\nexports.info = {\\n\\tname: \\\"deletetiddlers\\\",\\n\\tsynchronous: true\\n};\\n\\nvar Command = function(params,commander,callback) {\\n\\tthis.params = params;\\n\\tthis.commander = commander;\\n\\tthis.callback = callback;\\n};\\n\\nCommand.prototype.execute = function() {\\n\\tif(this.params.length \u003C 1) {\\n\\t\\treturn \\\"Missing filter\\\";\\n\\t}\\n\\tvar wiki = this.commander.wiki,\\n\\t\\tfilter = this.params[0],\\n\\t\\ttiddlers = wiki.filterTiddlers(filter);\\n\\t$tw.utils.each(tiddlers,function(title) {\\n\\t\\twiki.deleteTiddler(title);\\n\\t});\\n\\treturn null;\\n};\\n\\nexports.Command = Command;\\n\",\"type\":\"application/javascript\",\"module-type\":\"command\"},\"$:/core/modules/commands/editions.js\":{\"title\":\"$:/core/modules/commands/editions.js\",\"text\":\"/*\\\\\\ntitle: $:/core/modules/commands/editions.js\\ntype: application/javascript\\nmodule-type: command\\n\\nCommand to list the available editions\\n\\n\\\\*/\\n\\n\\\"use strict\\\";\\n\\nexports.info = {\\n\\tname: \\\"editions\\\",\\n\\tsynchronous: true\\n};\\n\\nvar Command = function(params,commander) {\\n\\tthis.params = params;\\n\\tthis.commander = commander;\\n};\\n\\nCommand.prototype.execute = function() {\\n\\tvar self = this;\\n\\t// Output the list\\n\\tthis.commander.streams.output.write(\\\"Available editions:\\\\n\\\\n\\\");\\n\\tvar editionInfo = $tw.utils.getEditionInfo();\\n\\t$tw.utils.each(editionInfo,function(info,name) {\\n\\t\\tself.commander.streams.output.write(\\\"    \\\" + name + \\\": \\\" + info.description + \\\"\\\\n\\\");\\n\\t});\\n\\tthis.commander.streams.output.write(\\\"\\\\n\\\");\\n\\treturn null;\\n};\\n\\nexports.Command = Command;\\n\",\"type\":\"application/javascript\",\"module-type\":\"command\"},\"$:/core/modules/commands/fetch.js\":{\"title\":\"$:/core/modules/commands/fetch.js\",\"text\":\"/*\\\\\\ntitle: $:/core/modules/commands/fetch.js\\ntype: application/javascript\\nmodule-type: command\\n\\nCommands to fetch external tiddlers\\n\\n\\\\*/\\n\\n\\\"use strict\\\";\\n\\nexports.info = {\\n\\tname: \\\"fetch\\\",\\n\\tsynchronous: false\\n};\\n\\nvar Command = function(params,commander,callback) {\\n\\tthis.params = params;\\n\\tthis.commander = commander;\\n\\tthis.callback = callback;\\n};\\n\\nCommand.prototype.execute = function() {\\n\\tif(this.params.length \u003C 2) {\\n\\t\\treturn \\\"Missing subcommand and url\\\";\\n\\t}\\n\\tswitch(this.params[0]) {\\n\\t\\tcase \\\"raw-file\\\":\\n\\t\\t\\treturn this.fetchFiles({\\n\\t\\t\\t\\traw: true,\\n\\t\\t\\t\\turl: this.params[1],\\n\\t\\t\\t\\ttransformFilter: this.params[2] || \\\"\\\",\\n\\t\\t\\t\\tcallback: this.callback\\n\\t\\t\\t});\\n\\t\\t\\tbreak;\\n\\t\\tcase \\\"file\\\":\\n\\t\\t\\treturn this.fetchFiles({\\n\\t\\t\\t\\turl: this.params[1],\\n\\t\\t\\t\\timportFilter: this.params[2],\\n\\t\\t\\t\\ttransformFilter: this.params[3] || \\\"\\\",\\n\\t\\t\\t\\tcallback: this.callback\\n\\t\\t\\t});\\n\\t\\t\\tbreak;\\n\\t\\tcase \\\"raw-files\\\":\\n\\t\\t\\treturn this.fetchFiles({\\n\\t\\t\\t\\traw: true,\\n\\t\\t\\t\\turlFilter: this.params[1],\\n\\t\\t\\t\\ttransformFilter: this.params[2] || \\\"\\\",\\n\\t\\t\\t\\tcallback: this.callback\\n\\t\\t\\t});\\n\\t\\t\\tbreak;\\n\\t\\tcase \\\"files\\\":\\n\\t\\t\\treturn this.fetchFiles({\\n\\t\\t\\t\\turlFilter: this.params[1],\\n\\t\\t\\t\\timportFilter: this.params[2],\\n\\t\\t\\t\\ttransformFilter: this.params[3] || \\\"\\\",\\n\\t\\t\\t\\tcallback: this.callback\\n\\t\\t\\t});\\n\\t\\t\\tbreak;\\n\\t}\\n\\treturn null;\\n};\\n\\nCommand.prototype.fetchFiles = function(options) {\\n\\tvar self = this;\\n\\t// Get the list of URLs\\n\\tvar urls;\\n\\tif(options.url) {\\n\\t\\turls = [options.url];\\n\\t} else if(options.urlFilter) {\\n\\t\\turls = this.commander.wiki.filterTiddlers(options.urlFilter);\\n\\t} else {\\n\\t\\treturn \\\"Missing URL\\\";\\n\\t}\\n\\t// Process each URL in turn\\n\\tvar next = 0;\\n\\tvar getNextFile = function(err) {\\n\\t\\tif(err) {\\n\\t\\t\\treturn options.callback(err);\\n\\t\\t}\\n\\t\\tif(next \u003C urls.length) {\\n\\t\\t\\tself.fetchFile(urls[next++],options,getNextFile);\\n\\t\\t} else {\\n\\t\\t\\toptions.callback(null);\\n\\t\\t}\\n\\t};\\n\\tgetNextFile(null);\\n\\t// Success\\n\\treturn null;\\n};\\n\\nCommand.prototype.fetchFile = function(url,options,callback,redirectCount) {\\n\\tif(redirectCount > 10) {\\n\\t\\treturn callback(\\\"Error too many redirects retrieving \\\" + url);\\n\\t}\\n\\tvar self = this,\\n\\t\\tlib = url.substr(0,8) === \\\"https://\\\" ? require(\\\"https\\\") : require(\\\"http\\\");\\n\\tlib.get(url).on(\\\"response\\\",function(response) {\\n\\t\\tvar type = (response.headers[\\\"content-type\\\"] || \\\"\\\").split(\\\";\\\")[0],\\n\\t\\t\\tdata = [];\\n\\t\\tself.commander.write(\\\"Reading \\\" + url + \\\": \\\");\\n\\t\\tresponse.on(\\\"data\\\",function(chunk) {\\n\\t\\t\\tdata.push(chunk);\\n\\t\\t\\tself.commander.write(\\\".\\\");\\n\\t\\t});\\n\\t\\tresponse.on(\\\"end\\\",function() {\\n\\t\\t\\tself.commander.write(\\\"\\\\n\\\");\\n\\t\\t\\tif(response.statusCode === 200) {\\n\\t\\t\\t\\tself.processBody(Buffer.concat(data),type,options,url);\\n\\t\\t\\t\\tcallback(null);\\n\\t\\t\\t} else {\\n\\t\\t\\t\\tif(response.statusCode === 302 || response.statusCode === 303 || response.statusCode === 307) {\\n\\t\\t\\t\\t\\treturn self.fetchFile(response.headers.location,options,callback,redirectCount + 1);\\n\\t\\t\\t\\t} else {\\n\\t\\t\\t\\t\\treturn callback(\\\"Error \\\" + response.statusCode + \\\" retrieving \\\" + url);\\n\\t\\t\\t\\t}\\n\\t\\t\\t}\\n\\t\\t});\\n\\t\\tresponse.on(\\\"error\\\",function(e) {\\n\\t\\t\\tconsole.log(\\\"Error on GET request: \\\" + e);\\n\\t\\t\\tcallback(e);\\n\\t\\t});\\n\\t});\\n\\treturn null;\\n};\\n\\nCommand.prototype.processBody = function(body,type,options,url) {\\n\\tvar self = this;\\n\\t// Collect the tiddlers in a wiki\\n\\tvar incomingWiki = new $tw.Wiki();\\n\\tif(options.raw) {\\n\\t\\tvar typeInfo = type ? $tw.config.contentTypeInfo[type] : null,\\n\\t\\t\\tencoding = typeInfo ? typeInfo.encoding : \\\"utf8\\\";\\n\\t\\tincomingWiki.addTiddler(new $tw.Tiddler({\\n\\t\\t\\ttitle: url,\\n\\t\\t\\ttype: type,\\n\\t\\t\\ttext: body.toString(encoding)\\n\\t\\t}));\\n\\t} else {\\n\\t\\t// Deserialise the file to extract the tiddlers\\n\\t\\tvar tiddlers = this.commander.wiki.deserializeTiddlers(type || \\\"text/html\\\",body.toString(\\\"utf8\\\"),{});\\n\\t\\t$tw.utils.each(tiddlers,function(tiddler) {\\n\\t\\t\\tincomingWiki.addTiddler(new $tw.Tiddler(tiddler));\\n\\t\\t});\\n\\t}\\n\\t// Filter the tiddlers to select the ones we want\\n\\tvar filteredTitles = incomingWiki.filterTiddlers(options.importFilter || \\\"[all[tiddlers]]\\\");\\n\\t// Import the selected tiddlers\\n\\tvar count = 0;\\n\\tincomingWiki.each(function(tiddler,title) {\\n\\t\\tif(filteredTitles.indexOf(title) !== -1) {\\n\\t\\t\\tvar newTiddler;\\n\\t\\t\\tif(options.transformFilter) {\\n\\t\\t\\t\\tvar transformedTitle = (incomingWiki.filterTiddlers(options.transformFilter,null,self.commander.wiki.makeTiddlerIterator([title])) || [\\\"\\\"])[0];\\n\\t\\t\\t\\tif(transformedTitle) {\\n\\t\\t\\t\\t\\tself.commander.log(\\\"Importing \\\" + title + \\\" as \\\" + transformedTitle);\\n\\t\\t\\t\\t\\tnewTiddler = new $tw.Tiddler(tiddler,{title: transformedTitle});\\n\\t\\t\\t\\t}\\n\\t\\t\\t} else {\\n\\t\\t\\t\\tself.commander.log(\\\"Importing \\\" + title);\\n\\t\\t\\t\\tnewTiddler = tiddler;\\n\\t\\t\\t}\\n\\t\\t\\tself.commander.wiki.importTiddler(newTiddler);\\n\\t\\t\\tcount++;\\n\\t\\t}\\n\\t});\\n\\tself.commander.log(\\\"Imported \\\" + count + \\\" tiddlers\\\");\\n};\\n\\nexports.Command = Command;\\n\",\"type\":\"application/javascript\",\"module-type\":\"command\"},\"$:/core/modules/commands/help.js\":{\"title\":\"$:/core/modules/commands/help.js\",\"text\":\"/*\\\\\\ntitle: $:/core/modules/commands/help.js\\ntype: application/javascript\\nmodule-type: command\\n\\nHelp command\\n\\n\\\\*/\\n\\n\\\"use strict\\\";\\n\\nexports.info = {\\n\\tname: \\\"help\\\",\\n\\tsynchronous: true\\n};\\n\\nvar Command = function(params,commander) {\\n\\tthis.params = params;\\n\\tthis.commander = commander;\\n};\\n\\nCommand.prototype.execute = function() {\\n\\tvar subhelp = this.params[0] || \\\"default\\\",\\n\\t\\thelpBase = \\\"$:/language/Help/\\\",\\n\\t\\ttext;\\n\\tif(!this.commander.wiki.getTiddler(helpBase + subhelp)) {\\n\\t\\tsubhelp = \\\"notfound\\\";\\n\\t}\\n\\t// Wikify the help as formatted text (ie block elements generate newlines)\\n\\ttext = this.commander.wiki.renderTiddler(\\\"text/plain-formatted\\\",helpBase + subhelp);\\n\\t// Remove any leading linebreaks\\n\\ttext = text.replace(/^(\\\\r?\\\\n)*/g,\\\"\\\");\\n\\tthis.commander.streams.output.write(text);\\n};\\n\\nexports.Command = Command;\\n\",\"type\":\"application/javascript\",\"module-type\":\"command\"},\"$:/core/modules/commands/import.js\":{\"title\":\"$:/core/modules/commands/import.js\",\"text\":\"/*\\\\\\ntitle: $:/core/modules/commands/import.js\\ntype: application/javascript\\nmodule-type: command\\n\\nCommand to import tiddlers from a file\\n\\n\\\\*/\\n\\n\\\"use strict\\\";\\n\\nexports.info = {\\n\\tname: \\\"import\\\",\\n\\tsynchronous: true\\n};\\n\\nvar Command = function(params,commander,callback) {\\n\\tthis.params = params;\\n\\tthis.commander = commander;\\n\\tthis.callback = callback;\\n};\\n\\nCommand.prototype.execute = function() {\\n\\tvar self = this,\\n\\t\\tfs = require(\\\"fs\\\");\\n\\tif(this.params.length \u003C 2) {\\n\\t\\treturn \\\"Missing parameters\\\";\\n\\t}\\n\\tvar filename = self.params[0],\\n\\t\\tdeserializer = self.params[1],\\n\\t\\ttitle = self.params[2] || filename,\\n\\t\\tencoding = self.params[3] || \\\"utf8\\\",\\n\\t\\ttext = fs.readFileSync(filename,encoding),\\n\\t\\ttiddlers = this.commander.wiki.deserializeTiddlers(null,text,{title: title},{deserializer: deserializer});\\n\\t$tw.utils.each(tiddlers,function(tiddler) {\\n\\t\\tself.commander.wiki.importTiddler(new $tw.Tiddler(tiddler));\\n\\t});\\n\\tthis.commander.log(tiddlers.length + \\\" tiddler(s) imported\\\");\\n\\treturn null;\\n};\\n\\nexports.Command = Command;\\n\",\"type\":\"application/javascript\",\"module-type\":\"command\"},\"$:/core/modules/commands/init.js\":{\"title\":\"$:/core/modules/commands/init.js\",\"text\":\"/*\\\\\\ntitle: $:/core/modules/commands/init.js\\ntype: application/javascript\\nmodule-type: command\\n\\nCommand to initialise an empty wiki folder\\n\\n\\\\*/\\n\\n\\\"use strict\\\";\\n\\nexports.info = {\\n\\tname: \\\"init\\\",\\n\\tsynchronous: true\\n};\\n\\nvar Command = function(params,commander) {\\n\\tthis.params = params;\\n\\tthis.commander = commander;\\n};\\n\\nCommand.prototype.execute = function() {\\n\\tvar fs = require(\\\"fs\\\");\\n\\t// Check that we don't already have a valid wiki folder\\n\\tif($tw.boot.wikiTiddlersPath || ($tw.utils.isDirectory($tw.boot.wikiPath) && !$tw.utils.isDirectoryEmpty($tw.boot.wikiPath))) {\\n\\t\\treturn \\\"Wiki folder is not empty\\\";\\n\\t}\\n\\t// Loop through each of the specified editions\\n\\tvar editions = this.params.length > 0 ? this.params : [\\\"empty\\\"];\\n\\tfor(var editionIndex=0; editionIndex\u003Ceditions.length; editionIndex++) {\\n\\t\\tvar editionName = editions[editionIndex];\\n\\t\\t// Check the edition exists\\n\\t\\tvar editionPath = $tw.findLibraryItem(editionName,$tw.getLibraryItemSearchPaths($tw.config.editionsPath,$tw.config.editionsEnvVar));\\n\\t\\tif(!$tw.utils.isDirectory(editionPath)) {\\n\\t\\t\\treturn \\\"Edition '\\\" + editionName + \\\"' not found\\\";\\n\\t\\t}\\n\\t\\t// Copy the edition content\\n\\t\\tvar err = $tw.utils.copyDirectory(editionPath,$tw.boot.wikiPath);\\n\\t\\tif(!err) {\\n\\t\\t\\tthis.commander.streams.output.write(\\\"Copied edition '\\\" + editionName + \\\"' to \\\" + $tw.boot.wikiPath + \\\"\\\\n\\\");\\n\\t\\t} else {\\n\\t\\t\\treturn err;\\n\\t\\t}\\n\\t}\\n\\t// Tweak the tiddlywiki.info to remove any included wikis\\n\\tvar packagePath = $tw.boot.wikiPath + \\\"/tiddlywiki.info\\\",\\n\\t\\tpackageJson = $tw.utils.parseJSONSafe(fs.readFileSync(packagePath));\\n\\tdelete packageJson.includeWikis;\\n\\tfs.writeFileSync(packagePath,JSON.stringify(packageJson,null,$tw.config.preferences.jsonSpaces));\\n\\treturn null;\\n};\\n\\nexports.Command = Command;\\n\",\"type\":\"application/javascript\",\"module-type\":\"command\"},\"$:/core/modules/commands/inspect/handlers/crud.js\":{\"title\":\"$:/core/modules/commands/inspect/handlers/crud.js\",\"text\":\"/*\\\\\\ntitle: $:/core/modules/commands/inspect/handlers/crud.js\\ntype: application/javascript\\nmodule-type: library\\n\\nMCP tool handlers for tiddler CRUD operations.\\n\\n\\\\*/\\n\\n\\\"use strict\\\";\\n\\nvar shared = require(\\\"$:/core/modules/commands/inspect/handlers/shared.js\\\");\\n\\nmodule.exports = {\\n\\t\\\"get_tiddler\\\": function(args) {\\n\\t\\tvar tiddler = $tw.wiki.getTiddler(args.title);\\n\\t\\tif(!tiddler) {\\n\\t\\t\\treturn { isError: true, content: [{ type: \\\"text\\\", text: \\\"Tiddler not found: \\\" + args.title }] };\\n\\t\\t}\\n\\t\\tif(tiddler.fields[\\\"plugin-type\\\"]) {\\n\\t\\t\\tvar pluginInfo = $tw.wiki.getPluginInfo(args.title);\\n\\t\\t\\tvar shadowTitles = pluginInfo && pluginInfo.tiddlers ? Object.keys(pluginInfo.tiddlers).sort() : [];\\n\\t\\t\\tvar fieldStrings = [];\\n\\t\\t\\tfor(var f in tiddler.fields) {\\n\\t\\t\\t\\tif(f === \\\"text\\\") continue;\\n\\t\\t\\t\\tfieldStrings.push(f + \\\": \\\" + tiddler.getFieldString(f));\\n\\t\\t\\t}\\n\\t\\t\\tvar readmeTitle = args.title + \\\"/readme\\\";\\n\\t\\t\\tvar readmeIdx = shadowTitles.indexOf(readmeTitle);\\n\\t\\t\\tif(readmeIdx > 0) {\\n\\t\\t\\t\\tshadowTitles.splice(readmeIdx, 1);\\n\\t\\t\\t\\tshadowTitles.unshift(readmeTitle);\\n\\t\\t\\t}\\n\\t\\t\\tvar ns = shared.buildTree(shadowTitles);\\n\\t\\t\\tvar header = ns.prefix ? ns.prefix + \\\" ... \\\" + shadowTitles.length + \\\" shadow tiddlers\\\\n\\\" : \\\"\\\";\\n\\t\\t\\tvar output = fieldStrings.join(\\\"\\\\n\\\") + \\\"\\\\n\\\\n\\\" + header + ns.tree;\\n\\t\\t\\treturn { content: [{ type: \\\"text\\\", text: output }] };\\n\\t\\t}\\n\\t\\tvar includeText = !!args.detailed;\\n\\t\\tif(args.format !== \\\"json\\\") {\\n\\t\\t\\tvar fieldStrings = [];\\n\\t\\t\\tfor(var f in tiddler.fields) {\\n\\t\\t\\t\\tif(f === \\\"text\\\") continue;\\n\\t\\t\\t\\tfieldStrings.push(f + \\\": \\\" + tiddler.getFieldString(f));\\n\\t\\t\\t}\\n\\t\\t\\tvar output = fieldStrings.join(\\\"\\\\n\\\");\\n\\t\\t\\tif(includeText && tiddler.fields.text !== undefined) {\\n\\t\\t\\t\\toutput += \\\"\\\\n\\\\n\\\" + tiddler.fields.text;\\n\\t\\t\\t}\\n\\t\\t\\treturn { content: [{ type: \\\"text\\\", text: output }] };\\n\\t\\t}\\n\\t\\tvar fields = {};\\n\\t\\tfor(var field in tiddler.fields) {\\n\\t\\t\\tif(field === \\\"text\\\" && !includeText) continue;\\n\\t\\t\\tvar value = tiddler.fields[field];\\n\\t\\t\\tif(Array.isArray(value)) {\\n\\t\\t\\t\\tfields[field] = value.slice();\\n\\t\\t\\t} else if($tw.utils.isDate(value)) {\\n\\t\\t\\t\\tfields[field] = $tw.utils.stringifyDate(value);\\n\\t\\t\\t} else {\\n\\t\\t\\t\\tfields[field] = value;\\n\\t\\t\\t}\\n\\t\\t}\\n\\t\\treturn { content: [{ type: \\\"text\\\", text: JSON.stringify(fields, null, $tw.config.preferences.jsonSpaces) }] };\\n\\t},\\n\\n\\t\\\"put_tiddler\\\": function(args) {\\n\\t\\tvar denied = shared.checkWritable(\\\"put_tiddler\\\");\\n\\t\\tif(denied) return denied;\\n\\t\\tvar checkPathAllowed = shared.getCheckPathAllowed();\\n\\t\\tvar title = args.title,\\n\\t\\t\\texistingTiddler = $tw.wiki.getTiddler(title),\\n\\t\\t\\tcreationFields = $tw.wiki.getCreationFields(),\\n\\t\\t\\tmodificationFields = $tw.wiki.getModificationFields(),\\n\\t\\t\\ttiddler;\\n\\t\\tif(existingTiddler && args.overwrite) {\\n\\t\\t\\ttiddler = new $tw.Tiddler(existingTiddler.fields, args.fields, modificationFields, {title: title});\\n\\t\\t} else if(existingTiddler) {\\n\\t\\t\\ttitle = $tw.wiki.generateNewTitle(title);\\n\\t\\t\\ttiddler = new $tw.Tiddler(creationFields, args.fields, modificationFields, {title: title});\\n\\t\\t} else {\\n\\t\\t\\ttiddler = new $tw.Tiddler(creationFields, args.fields, modificationFields, {title: title});\\n\\t\\t}\\n\\t\\t$tw.wiki.addTiddler(tiddler);\\n\\t\\tif($tw.boot.wikiTiddlersPath) {\\n\\t\\t\\ttry {\\n\\t\\t\\t\\tvar pathFilters, extFilters;\\n\\t\\t\\t\\tif($tw.wiki.tiddlerExists(\\\"$:/config/FileSystemPaths\\\")) {\\n\\t\\t\\t\\t\\tpathFilters = $tw.wiki.getTiddlerText(\\\"$:/config/FileSystemPaths\\\", \\\"\\\").split(\\\"\\\\n\\\");\\n\\t\\t\\t\\t}\\n\\t\\t\\t\\tif($tw.wiki.tiddlerExists(\\\"$:/config/FileSystemExtensions\\\")) {\\n\\t\\t\\t\\t\\textFilters = $tw.wiki.getTiddlerText(\\\"$:/config/FileSystemExtensions\\\", \\\"\\\").split(\\\"\\\\n\\\");\\n\\t\\t\\t\\t}\\n\\t\\t\\t\\tvar fileInfo = $tw.utils.generateTiddlerFileInfo(tiddler, {\\n\\t\\t\\t\\t\\tdirectory: $tw.boot.wikiTiddlersPath,\\n\\t\\t\\t\\t\\tpathFilters: pathFilters,\\n\\t\\t\\t\\t\\textFilters: extFilters,\\n\\t\\t\\t\\t\\twiki: $tw.wiki,\\n\\t\\t\\t\\t\\tfileInfo: $tw.boot.files[title] || {}\\n\\t\\t\\t\\t});\\n\\t\\t\\t\\tvar pathDenied = checkPathAllowed(fileInfo.filepath);\\n\\t\\t\\t\\tif(pathDenied) {\\n\\t\\t\\t\\t\\t$tw.wiki.deleteTiddler(title);\\n\\t\\t\\t\\t\\treturn pathDenied;\\n\\t\\t\\t\\t}\\n\\t\\t\\t\\t$tw.utils.saveTiddlerToFileSync(tiddler, fileInfo);\\n\\t\\t\\t\\t$tw.boot.files[title] = fileInfo;\\n\\t\\t\\t\\treturn { content: [{ type: \\\"text\\\", text: \\\"Tiddler saved: \\\" + title + \\\" -> \\\" + fileInfo.filepath }] };\\n\\t\\t\\t} catch(e) {\\n\\t\\t\\t\\treturn { isError: true, content: [{ type: \\\"text\\\", text: \\\"Tiddler added to store but failed to save to disk: \\\" + e.message }] };\\n\\t\\t\\t}\\n\\t\\t}\\n\\t\\treturn { content: [{ type: \\\"text\\\", text: \\\"Tiddler saved to store only (no wiki tiddlers path): \\\" + title }] };\\n\\t},\\n\\n\\t\\\"delete_tiddler\\\": function(args) {\\n\\t\\tvar denied = shared.checkWritable(\\\"delete_tiddler\\\");\\n\\t\\tif(denied) return denied;\\n\\t\\tvar checkPathAllowed = shared.getCheckPathAllowed();\\n\\t\\tif(!$tw.wiki.tiddlerExists(args.title)) {\\n\\t\\t\\treturn { isError: true, content: [{ type: \\\"text\\\", text: \\\"Tiddler not found: \\\" + args.title }] };\\n\\t\\t}\\n\\t\\tvar fileInfo = $tw.boot.files && $tw.boot.files[args.title];\\n\\t\\tif(fileInfo) {\\n\\t\\t\\tvar pathDenied = checkPathAllowed(fileInfo.filepath);\\n\\t\\t\\tif(pathDenied) return pathDenied;\\n\\t\\t\\ttry {\\n\\t\\t\\t\\t$tw.utils.deleteTiddlerFile(fileInfo, function(err) {\\n\\t\\t\\t\\t\\tif(err) {\\n\\t\\t\\t\\t\\t\\tprocess.stderr.write(\\\"[tw-mcp] Error deleting file for tiddler: \\\" + args.title + \\\": \\\" + err + \\\"\\\\n\\\");\\n\\t\\t\\t\\t\\t}\\n\\t\\t\\t\\t});\\n\\t\\t\\t\\tdelete $tw.boot.files[args.title];\\n\\t\\t\\t} catch(e) {\\n\\t\\t\\t\\t$tw.wiki.deleteTiddler(args.title);\\n\\t\\t\\t\\treturn { isError: true, content: [{ type: \\\"text\\\", text: \\\"Tiddler deleted from store but failed to remove file: \\\" + e.message }] };\\n\\t\\t\\t}\\n\\t\\t}\\n\\t\\t$tw.wiki.deleteTiddler(args.title);\\n\\t\\treturn { content: [{ type: \\\"text\\\", text: \\\"Tiddler deleted: \\\" + args.title }] };\\n\\t}\\n};\\n\",\"type\":\"application/javascript\",\"module-type\":\"library\"},\"$:/core/modules/commands/inspect/handlers/filesystem.js\":{\"title\":\"$:/core/modules/commands/inspect/handlers/filesystem.js\",\"text\":\"/*\\\\\\ntitle: $:/core/modules/commands/inspect/handlers/filesystem.js\\ntype: application/javascript\\nmodule-type: library\\n\\nMCP tool handlers for filesystem and build operations.\\n\\n\\\\*/\\n\\n\\\"use strict\\\";\\n\\nvar fs = require(\\\"fs\\\"),\\n\\tpath = require(\\\"path\\\");\\n\\nvar shared = require(\\\"$:/core/modules/commands/inspect/handlers/shared.js\\\");\\n\\n// Change log: accumulates $tw.wiki changes between reload_tiddlers calls\\nvar changeLog = {};\\nvar changeLogActive = false;\\n\\nfunction startChangeLog() {\\n\\tif(changeLogActive) {\\n\\t\\treturn;\\n\\t}\\n\\tchangeLogActive = true;\\n\\t$tw.wiki.addEventListener(\\\"change\\\", function(changes) {\\n\\t\\tvar titles = Object.keys(changes);\\n\\t\\tfor(var i = 0; i \u003C titles.length; i++) {\\n\\t\\t\\tvar title = titles[i];\\n\\t\\t\\tif(title.indexOf(\\\"$:/\\\") === 0) {\\n\\t\\t\\t\\tcontinue;\\n\\t\\t\\t}\\n\\t\\t\\tif(changes[title].deleted) {\\n\\t\\t\\t\\tchangeLog[title] = \\\"deleted\\\";\\n\\t\\t\\t} else if(changeLog[title] === undefined) {\\n\\t\\t\\t\\tchangeLog[title] = \\\"added\\\";\\n\\t\\t\\t} else {\\n\\t\\t\\t\\tchangeLog[title] = \\\"updated\\\";\\n\\t\\t\\t}\\n\\t\\t}\\n\\t});\\n}\\n\\nmodule.exports = {\\n\\t\\\"reload_tiddlers\\\": function() {\\n\\t\\tif(!$tw.boot.wikiTiddlersPath) {\\n\\t\\t\\treturn { isError: true, content: [{ type: \\\"text\\\", text: \\\"No wiki tiddlers path available. Cannot reload from filesystem.\\\" }] };\\n\\t\\t}\\n\\t\\tvar resolvedWikiPath = $tw.boot.wikiTiddlersPath;\\n\\t\\tvar wikiInfo = $tw.boot.wikiInfo || {};\\n\\t\\tvar config = wikiInfo.config || {};\\n\\t\\tvar countBefore = $tw.wiki.allTitles().length;\\n\\t\\tvar added = 0, updated = 0, skippedSystem = 0, unchanged = 0;\\n\\t\\tvar diskTiddlers = Object.create(null);\\n\\t\\tvar diskFileInfo = Object.create(null);\\n\\t\\t$tw.utils.each($tw.loadTiddlersFromPath(resolvedWikiPath), function(tiddlerFile) {\\n\\t\\t\\t$tw.utils.each(tiddlerFile.tiddlers, function(tiddlerFields) {\\n\\t\\t\\t\\tvar title = tiddlerFields.title;\\n\\t\\t\\t\\tif(!title) return;\\n\\t\\t\\t\\tdiskTiddlers[title] = tiddlerFields;\\n\\t\\t\\t\\tif(tiddlerFile.filepath) {\\n\\t\\t\\t\\t\\tdiskFileInfo[title] = {\\n\\t\\t\\t\\t\\t\\tfilepath: tiddlerFile.filepath,\\n\\t\\t\\t\\t\\t\\ttype: tiddlerFile.type,\\n\\t\\t\\t\\t\\t\\thasMetaFile: tiddlerFile.hasMetaFile,\\n\\t\\t\\t\\t\\t\\tisEditableFile: config[\\\"retain-original-tiddler-path\\\"] || tiddlerFile.isEditableFile || tiddlerFile.filepath.indexOf($tw.boot.wikiTiddlersPath) !== 0\\n\\t\\t\\t\\t\\t};\\n\\t\\t\\t\\t}\\n\\t\\t\\t});\\n\\t\\t});\\n\\t\\tfor(var title in diskTiddlers) {\\n\\t\\t\\tif(title.indexOf(\\\"$:/\\\") === 0) {\\n\\t\\t\\t\\tskippedSystem++;\\n\\t\\t\\t\\tcontinue;\\n\\t\\t\\t}\\n\\t\\t\\tvar tiddlerFields = diskTiddlers[title];\\n\\t\\t\\tif(diskFileInfo[title]) {\\n\\t\\t\\t\\t$tw.boot.files[title] = diskFileInfo[title];\\n\\t\\t\\t}\\n\\t\\t\\tvar existing = $tw.wiki.getTiddler(title);\\n\\t\\t\\tif(existing) {\\n\\t\\t\\t\\tvar changed = false;\\n\\t\\t\\t\\tvar newTiddler = new $tw.Tiddler(tiddlerFields);\\n\\t\\t\\t\\tvar existingFields = existing.getFieldStrings();\\n\\t\\t\\t\\tvar newFields = newTiddler.getFieldStrings();\\n\\t\\t\\t\\tif(Object.keys(existingFields).length !== Object.keys(newFields).length) {\\n\\t\\t\\t\\t\\tchanged = true;\\n\\t\\t\\t\\t} else {\\n\\t\\t\\t\\t\\tfor(var field in newFields) {\\n\\t\\t\\t\\t\\t\\tif(existingFields[field] !== newFields[field]) {\\n\\t\\t\\t\\t\\t\\t\\tchanged = true;\\n\\t\\t\\t\\t\\t\\t\\tbreak;\\n\\t\\t\\t\\t\\t\\t}\\n\\t\\t\\t\\t\\t}\\n\\t\\t\\t\\t}\\n\\t\\t\\t\\tif(changed) {\\n\\t\\t\\t\\t\\t$tw.wiki.addTiddler(newTiddler);\\n\\t\\t\\t\\t\\tupdated++;\\n\\t\\t\\t\\t} else {\\n\\t\\t\\t\\t\\tunchanged++;\\n\\t\\t\\t\\t}\\n\\t\\t\\t} else {\\n\\t\\t\\t\\t$tw.wiki.addTiddler(new $tw.Tiddler(tiddlerFields));\\n\\t\\t\\t\\tadded++;\\n\\t\\t\\t}\\n\\t\\t}\\n\\t\\tvar deleted = 0;\\n\\t\\tvar allTitles = $tw.wiki.allTitles();\\n\\t\\tfor(var ti = 0; ti \u003C allTitles.length; ti++) {\\n\\t\\t\\tvar t = allTitles[ti];\\n\\t\\t\\tif($tw.boot.files[t] && $tw.boot.files[t].filepath) {\\n\\t\\t\\t\\tvar filePath = $tw.boot.files[t].filepath;\\n\\t\\t\\t\\tif(filePath.indexOf(resolvedWikiPath) === 0 && !diskTiddlers[t]) {\\n\\t\\t\\t\\t\\t$tw.wiki.deleteTiddler(t);\\n\\t\\t\\t\\t\\tdelete $tw.boot.files[t];\\n\\t\\t\\t\\t\\tdeleted++;\\n\\t\\t\\t\\t}\\n\\t\\t\\t}\\n\\t\\t}\\n\\t\\tvar countAfter = $tw.wiki.allTitles().length;\\n\\t\\tvar msg = \\\"Tiddlers reloaded from: \\\" + resolvedWikiPath + \\\"\\\\nBefore: \\\" + countBefore + \\\", After: \\\" + countAfter + \\\" (added: \\\" + added + \\\", updated: \\\" + updated + \\\", unchanged: \\\" + unchanged + \\\", skipped-system: \\\" + skippedSystem + \\\", deleted: \\\" + deleted + \\\")\\\";\\n\\t\\t// Report changes since last reload\\n\\t\\tvar logTitles = Object.keys(changeLog);\\n\\t\\tif(logTitles.length > 0) {\\n\\t\\t\\tvar logAdded = 0, logUpdated = 0, logDeleted = 0;\\n\\t\\t\\tvar logLines = [];\\n\\t\\t\\tlogTitles.sort();\\n\\t\\t\\tfor(var li = 0; li \u003C logTitles.length; li++) {\\n\\t\\t\\t\\tvar lt = logTitles[li];\\n\\t\\t\\t\\tvar action = changeLog[lt];\\n\\t\\t\\t\\tif(action === \\\"added\\\") { logAdded++; logLines.push(\\\"  + \\\" + lt); }\\n\\t\\t\\t\\telse if(action === \\\"updated\\\") { logUpdated++; logLines.push(\\\"  ~ \\\" + lt); }\\n\\t\\t\\t\\telse if(action === \\\"deleted\\\") { logDeleted++; logLines.push(\\\"  - \\\" + lt); }\\n\\t\\t\\t}\\n\\t\\t\\tmsg += \\\"\\\\n\\\\nSince last reload: \\\" + logAdded + \\\" added, \\\" + logUpdated + \\\" updated, \\\" + logDeleted + \\\" deleted\\\";\\n\\t\\t\\tmsg += \\\"\\\\n\\\" + logLines.join(\\\"\\\\n\\\");\\n\\t\\t\\tchangeLog = {};\\n\\t\\t} else if(changeLogActive) {\\n\\t\\t\\tmsg += \\\"\\\\n\\\\nSince last reload: no changes\\\";\\n\\t\\t} else {\\n\\t\\t\\tmsg += \\\"\\\\n\\\\nChange tracking started.\\\";\\n\\t\\t}\\n\\t\\tstartChangeLog();\\n\\t\\treturn { content: [{ type: \\\"text\\\", text: msg }] };\\n\\t},\\n\\n\\t\\\"save_wiki_folder\\\": function(args) {\\n\\t\\tvar denied = shared.checkWritable(\\\"save_wiki_folder\\\");\\n\\t\\tif(denied) return denied;\\n\\t\\tvar checkPathAllowed = shared.getCheckPathAllowed();\\n\\t\\tvar outputPath = path.resolve(args.path);\\n\\t\\tvar pathDenied = checkPathAllowed(outputPath);\\n\\t\\tif(pathDenied) return pathDenied;\\n\\t\\tvar tiddlerFilter = args.filter || \\\"[all[tiddlers]]\\\";\\n\\t\\tvar explodePlugins = (args.explodePlugins === \\\"no\\\") ? \\\"no\\\" : \\\"yes\\\";\\n\\t\\ttry {\\n\\t\\t\\tvar commander = new $tw.Commander(\\n\\t\\t\\t\\t[\\\"--savewikifolder\\\", outputPath, \\\"filter=\\\" + tiddlerFilter, \\\"explodePlugins=\\\" + explodePlugins],\\n\\t\\t\\t\\tfunction(err) {\\n\\t\\t\\t\\t\\tif(err) {\\n\\t\\t\\t\\t\\t\\tprocess.stderr.write(\\\"[tw-mcp] savewikifolder error: \\\" + err + \\\"\\\\n\\\");\\n\\t\\t\\t\\t\\t}\\n\\t\\t\\t\\t},\\n\\t\\t\\t\\t$tw.wiki\\n\\t\\t\\t);\\n\\t\\t\\tcommander.execute();\\n\\t\\t\\treturn { content: [{ type: \\\"text\\\", text: \\\"Wiki folder saved to: \\\" + outputPath }] };\\n\\t\\t} catch(e) {\\n\\t\\t\\treturn { isError: true, content: [{ type: \\\"text\\\", text: \\\"Failed to save wiki folder: \\\" + e.message }] };\\n\\t\\t}\\n\\t},\\n\\n\\t\\\"upload_file\\\": function(args) {\\n\\t\\tvar denied = shared.checkWritable(\\\"upload_file\\\");\\n\\t\\tif(denied) return denied;\\n\\t\\tvar checkPathAllowed = shared.getCheckPathAllowed();\\n\\t\\tvar filename = args.filename;\\n\\t\\tif(filename.indexOf(\\\"/\\\") !== -1 || filename.indexOf(\\\"\\\\\\\\\\\") !== -1 || filename.indexOf(\\\"..\\\") !== -1) {\\n\\t\\t\\treturn { isError: true, content: [{ type: \\\"text\\\", text: \\\"Invalid filename: must not contain path separators or '..'\\\" }] };\\n\\t\\t}\\n\\t\\tvar wikiPath = $tw.boot.wikiPath;\\n\\t\\tif(!wikiPath) {\\n\\t\\t\\treturn { isError: true, content: [{ type: \\\"text\\\", text: \\\"No wiki path available\\\" }] };\\n\\t\\t}\\n\\t\\tvar filesDir = path.resolve(wikiPath, \\\"files\\\");\\n\\t\\tif(args.subfolder) {\\n\\t\\t\\tvar subfolder = args.subfolder;\\n\\t\\t\\tif(subfolder.indexOf(\\\"..\\\") !== -1) {\\n\\t\\t\\t\\treturn { isError: true, alue(val[k]);\\n\\t\\t\\t\\t\\t\\t} else {\\n\\t\\t\\t\\t\\t\\t\\tout[k] = val[k];\\n\\t\\t\\t\\t\\t\\t}\\n\\t\\t\\t\\t\\t}\\n\\t\\t\\t\\t\\treturn out;\\n\\t\\t\\t\\t};\\n\\t\\t\\t\\tvar compactTree = parser.tree.map(compactValue);\\n\\t\\t\\t\\tvar header = \\\"\\\";\\n\\t\\t\\t\\tif(excludeSet.start || excludeSet.end) {\\n\\t\\t\\t\\t\\tvar removed = [];\\n\\t\\t\\t\\t\\tif(excludeSet.start) removed.push(\\\"start\\\");\\n\\t\\t\\t\\t\\tif(excludeSet.end) removed.push(\\\"end\\\");\\n\\t\\t\\t\\t\\theader = \\\"(excluded: \\\" + removed.join(\\\", \\\") + \\\")\\\\n\\\";\\n\\t\\t\\t\\t}\\n\\t\\t\\t\\treturn { content: [{ type: \\\"text\\\", text: header + JSON.stringify(compactTree, null, $tw.config.preferences.jsonSpaces) }] };\\n\\t\\t\\t}\\n\\t\\t\\tvar rendered = shared.parseAndRender(args.text, inputType, args.context);\\n\\t\\t\\tif(!rendered) {\\n\\t\\t\\t\\treturn { isError: true, content: [{ type: \\\"text\\\", text: \\\"No parser for type: \\\" + inputType }] };\\n\\t\\t\\t}\\n\\t\\t\\tvar text;\\n\\t\\t\\tif(outputType === \\\"text/html\\\") {\\n\\t\\t\\t\\ttext = rendered.container.innerHTML;\\n\\t\\t\\t} else if(outputType === \\\"text/plain-formatted\\\") {\\n\\t\\t\\t\\ttext = rendered.container.formattedTextContent;\\n\\t\\t\\t} else {\\n\\t\\t\\t\\ttext = rendered.container.textContent;\\n\\t\\t\\t}\\n\\t\\t\\treturn { content: [{ type: \\\"text\\\", text: text }] };\\n\\t\\t} catch(e) {\\n\\t\\t\\treturn { isError: true, content: [{ type: \\\"text\\\", text: \\\"Render error: \\\" + e.message }] };\\n\\t\\t}\\n\\t}\\n};\\n\",\"type\":\"application/javascript\",\"module-type\":\"library\"},\"$:/core/modules/commands/inspect/handlers/shared.js\":{\"title\":\"$:/core/modules/commands/inspect/handlers/shared.js\",\"text\":\"/*\\\\\\ntitle: $:/core/modules/commands/inspect/handlers/shared.js\\ntype: application/javascript\\nmodule-type: library\\n\\nShared utilities and state for MCP tool handlers.\\n\\n\\\\*/\\n\\n\\\"use strict\\\";\\n\\nvar fs = require(\\\"fs\\\"),\\n\\tpath = require(\\\"path\\\");\\n\\n// Source position format — must match $:/plugins/tiddlywiki/sourcepos/utils.js\\nvar SOURCE_POS_SEPARATOR = \\\" @ \\\";\\nfunction formatSourcePos(startLine, endLine, title) {\\n\\tvar pos = (startLine === endLine) ? \\\"L\\\" + startLine : \\\"L\\\" + startLine + \\\"-L\\\" + endLine;\\n\\tif(title) pos += SOURCE_POS_SEPARATOR + title;\\n\\treturn pos;\\n}\\n\\n// Module-level state, set via init()\\nvar readonlyMode = false;\\nvar checkPathAllowed = null;\\n\\nfunction init(context) {\\n\\treadonlyMode = context.readonlyMode;\\n\\tcheckPathAllowed = context.checkPathAllowed;\\n}\\n\\nfunction checkWritable(toolName) {\\n\\tif(readonlyMode) {\\n\\t\\treturn { isError: true, content: [{ type: \\\"text\\\", text: \\\"Tool '\\\" + toolName + \\\"' is disabled in readonly mode\\\" }] };\\n\\t}\\n\\treturn null;\\n}\\n\\nfunction isReadonly() {\\n\\treturn readonlyMode;\\n}\\n\\nfunction getCheckPathAllowed() {\\n\\treturn checkPathAllowed;\\n}\\n\\nvar MAX_FILTER_LENGTH = 10000;\\nvar MAX_TEXT_LENGTH = 500000;\\n\\n// Build namespace tree from sorted titles.\\nfunction buildTree(titles, maxDepth, _indent) {\\n\\tif(!titles.length) return { prefix: \\\"\\\", tree: \\\"\\\" };\\n\\tif(maxDepth === undefined) maxDepth = 1;\\n\\t_indent = _indent || \\\"\\\";\\n\\tvar commonParts = titles[0].split(\\\"/\\\");\\n\\tfor(var i = 1; i \u003C titles.length; i++) {\\n\\t\\tvar parts = titles[i].split(\\\"/\\\");\\n\\t\\tvar match = 0;\\n\\t\\tfor(var j = 0; j \u003C Math.min(commonParts.length, parts.length); j++) {\\n\\t\\t\\tif(parts[j] === commonParts[j]) { match++; } else { break; }\\n\\t\\t}\\n\\t\\tcommonParts = commonParts.slice(0, match);\\n\\t\\tif(!commonParts.length) break;\\n\\t}\\n\\tvar commonPrefix = commonParts.length >= 2 ? commonParts.join(\\\"/\\\") + \\\"/\\\" : \\\"\\\";\\n\\tvar prefixDepth = commonPrefix ? commonParts.length : 0;\\n\\tvar groupDepth = prefixDepth > 0 ? prefixDepth + 1 : 2;\\n\\tvar groups = {};\\n\\tvar groupOrder = [];\\n\\tfor(var i = 0; i \u003C titles.length; i++) {\\n\\t\\tvar parts = titles[i].split(\\\"/\\\");\\n\\t\\tvar key;\\n\\t\\tif(parts.length \u003C= groupDepth) {\\n\\t\\t\\tkey = commonPrefix ? titles[i].slice(commonPrefix.length) || titles[i] : titles[i];\\n\\t\\t} else {\\n\\t\\t\\tkey = parts.slice(prefixDepth, groupDepth).join(\\\"/\\\") + \\\"/\\\";\\n\\t\\t}\\n\\t\\tif(!groups[key]) {\\n\\t\\t\\tgroups[key] = [];\\n\\t\\t\\tgroupOrder.push(key);\\n\\t\\t}\\n\\t\\tgroups[key].push(titles[i]);\\n\\t}\\n\\tgroupOrder.sort();\\n\\tvar lines = [];\\n\\tfor(var k = 0; k \u003C groupOrder.length; k++) {\\n\\t\\tvar key = groupOrder[k];\\n\\t\\tvar items = groups[key];\\n\\t\\tif(key.slice(-1) === \\\"/\\\" && maxDepth > 1 && items.length > 1) {\\n\\t\\t\\tvar sub = buildTree(items, maxDepth - 1, _indent + \\\"\\\\t\\\");\\n\\t\\t\\tvar relPrefix = sub.prefix.slice(commonPrefix.length);\\n\\t\\t\\tlines.push(_indent + \\\"\\\\t\\\" + relPrefix + \\\" (\\\" + items.length + \\\")\\\");\\n\\t\\t\\tif(sub.tree) lines.push(sub.tree);\\n\\t\\t} else if(key.slice(-1) === \\\"/\\\") {\\n\\t\\t\\tlines.push(_indent + \\\"\\\\t\\\" + key + \\\" (\\\" + items.length + \\\")\\\");\\n\\t\\t} else {\\n\\t\\t\\tlines.push(_indent + \\\"\\\\t\\\" + key);\\n\\t\\t}\\n\\t}\\n\\treturn { prefix: commonPrefix, tree: lines.join(\\\"\\\\n\\\") };\\n}\\n\\n// Shared parse+render helper\\nfunction parseAndRender(text, inputType, context, extraVariables) {\\n\\tvar parser = $tw.wiki.parseText(inputType || \\\"text/vnd.tiddlywiki\\\", text, { parseAsInline: false });\\n\\tif(!parser) return null;\\n\\tvar importFilter = $tw.wiki.getTiddlerText(\\\"$:/core/config/GlobalImportFilter\\\");\\n\\tvar wrappedTree = {tree: [{\\n\\t\\ttype: \\\"importvariables\\\",\\n\\t\\tattributes: {\\n\\t\\t\\tfilter: { name: \\\"filter\\\", type: \\\"string\\\", value: importFilter }\\n\\t\\t},\\n\\t\\tisBlock: false,\\n\\t\\tchildren: parser.tree\\n\\t}]};\\n\\tvar widgetOptions = { document: $tw.fakeDocument };\\n\\tvar vars = {};\\n\\tif(context) {\\n\\t\\tvars.currentTiddler = context;\\n\\t}\\n\\tif(extraVariables) {\\n\\t\\tvar extraKeys = Object.keys(extraVariables);\\n\\t\\tfor(var ei = 0; ei \u003C extraKeys.length; ei++) {\\n\\t\\t\\tvars[extraKeys[ei]] = extraVariables[extraKeys[ei]];\\n\\t\\t}\\n\\t}\\n\\tif(Object.keys(vars).length > 0) {\\n\\t\\twidgetOptions.variables = vars;\\n\\t}\\n\\tvar widgetNode = $tw.wiki.makeWidget(wrappedTree, widgetOptions);\\n\\tvar container = $tw.fakeDocument.createElement(\\\"div\\\");\\n\\twidgetNode.render(container, null);\\n\\treturn { parser: parser, wrappedTree: wrappedTree, widgetOptions: widgetOptions, widgetNode: widgetNode, container: container };\\n}\\n\\n// Inspect helpers\\n\\nfunction formatFnSource(fnStr, pad, full) {\\n\\tvar srcLines = fnStr.split(\\\"\\\\n\\\");\\n\\tvar out = [];\\n\\tif(full) {\\n\\t\\tfor(var f = 0; f \u003C srcLines.length; f++) {\\n\\t\\t\\tout.push(pad + \\\"  \\\" + srcLines[f].replace(/\\\\t/g, \\\"  \\\"));\\n\\t\\t}\\n\\t} else {\\n\\t\\tvar head = srcLines.slice(0, 5);\\n\\t\\tfor(var h = 0; h \u003C head.length; h++) {\\n\\t\\t\\tout.push(pad + \\\"  \\\" + head[h].replace(/\\\\t/g, \\\"  \\\"));\\n\\t\\t}\\n\\t\\tvar rest = srcLines.length - 5;\\n\\t\\tif(rest > 0) {\\n\\t\\t\\tout.push(pad + \\\"  ...\\\" + rest + \\\" more lines\\\");\\n\\t\\t}\\n\\t}\\n\\treturn out;\\n}\\n\\nfunction inspectValue(val, key, indent, depthLeft, excludeSet) {\\n\\tvar lines = [];\\n\\tvar pad = \\\"\\\";\\n\\tfor(var p = 0; p \u003C indent; p++) { pad += \\\"  \\\"; }\\n\\tvar type = typeof val;\\n\\tif(val === null || val === undefined) {\\n\\t\\tlines.push(pad + key + \\\" \\\" + String(val));\\n\\t} else if(type === \\\"string\\\") {\\n\\t\\tvar display = val.length > 70 ? val.substring(0, 70) + \\\"~\\\" : val;\\n\\t\\tlines.push(pad + key + \\\" s:\\\" + val.length + \\\" \\\" + display.replace(/\\\\n/g, \\\"\\\\\\\\n\\\"));\\n\\t} else if(type === \\\"number\\\" || type === \\\"boolean\\\") {\\n\\t\\tlines.push(pad + key + \\\"=\\\" + String(val));\\n\\t} else if(val instanceof Date || Object.prototype.toString.call(val) === \\\"[object Date]\\\" || ($tw.utils.isDate && $tw.utils.isDate(val))) {\\n\\t\\tlines.push(pad + key + \\\" date:\\\" + val.toISOString());\\n\\t} else if(type === \\\"function\\\") {\\n\\t\\tvar fnStr = Function.prototype.toString.call(val);\\n\\t\\tvar sigMatch = fnStr.match(/^(?:function\\\\s*[^(]*)(\\\\([^)]*\\\\))/);\\n\\t\\tvar sig = sigMatch ? sigMatch[1] : \\\"(\\\" + (val.length || 0) + \\\")\\\";\\n\\t\\tlines.push(pad + \\\"fn \\\" + key + sig);\\n\\t\\tif(depthLeft > 0) {\\n\\t\\t\\tlines = lines.concat(formatFnSource(fnStr, pad));\\n\\t\\t}\\n\\t} else if(Array.isArray(val)) {\\n\\t\\tlines.push(pad + key + \\\" [\\\" + val.length + \\\"]\\\");\\n\\t\\tif(depthLeft > 0 && val.length > 0) {\\n\\t\\t\\tvar arrLimit = Math.min(val.length, 20);\\n\\t\\t\\tfor(var a = 0; a \u003C arrLimit; a++) {\\n\\t\\t\\t\\ttry {\\n\\t\\t\\t\\t\\tlines = lines.concat(inspectValue(val[a], \\\"[\\\" + a + \\\"]\\\", indent + 1, 0, excludeSet));\\n\\t\\t\\t\\t} catch(e) {\\n\\t\\t\\t\\t\\tlines.push(pad + \\\"  [\\\" + a + \\\"] !err\\\");\\n\\t\\t\\t\\t}\\n\\t\\t\\t}\\n\\t\\t\\tif(val.length > arrLimit) {\\n\\t\\t\\t\\tlines.push(pad + \\\"  ...\\\" + (val.length - arrLimit) + \\\" more\\\");\\n\\t\\t\\t}\\n\\t\\t}\\n\\t} else {\\n\\t\\tvar childKeys;\\n\\t\\ttry {\\n\\t\\t\\tchildKeys = Object.keys(val);\\n\\t\\t} catch(e2) {\\n\\t\\t\\tlines.push(pad + key + \\\" {?}\\\");\\n\\t\\t\\treturn lines;\\n\\t\\t}\\n\\t\\tlines.push(pad + key + \\\" {\\\" + childKeys.length + \\\"}\\\");\\n\\t\\tif(depthLeft > 0) {\\n\\t\\t\\tchildKeys.sort();\\n\\t\\t\\tfor(var c = 0; c \u003C childKeys.length; c++) {\\n\\t\\t\\t\\tif(excludeSet && excludeSet[childKeys[c]]) { continue; }\\n\\t\\t\\t\\ttry {\\n\\t\\t\\t\\t\\tlines = lines.concat(inspectValue(val[childKeys[c]], childKeys[c], indent + 1, depthLeft - 1, excludeSet));\\n\\t\\t\\t\\t} catch(e3) {\\n\\t\\t\\t\\t\\tlines.push(pad + \\\"  \\\" + childKeys[c] + \\\" !err\\\");\\n\\t\\t\\t\\t}\\n\\t\\t\\t}\\n\\t\\t}\\n\\t}\\n\\treturn lines;\\n}\\n\\nfunction computeMaxDepth(obj, limit) {\\n\\tif(limit \u003C= 0 || obj === null || obj === undefined) {\\n\\t\\treturn 0;\\n\\t}\\n\\tvar type = typeof obj;\\n\\tif(type !== \\\"object\\\" && type !== \\\"function\\\") {\\n\\t\\treturn 0;\\n\\t}\\n\\tvar keys;\\n\\ttry {\\n\\t\\tkeys = Object.keys(obj);\\n\\t} catch(e) {\\n\\t\\treturn 0;\\n\\t}\\n\\tif(keys.length === 0) {\\n\\t\\treturn 0;\\n\\t}\\n\\tvar deepest = 0;\\n\\tfor(var i = 0; i \u003C keys.length && i \u003C 50; i++) {\\n\\t\\ttry {\\n\\t\\t\\tvar child = obj[keys[i]];\\n\\t\\t\\tif(child !== null && child !== undefined && (typeof child === \\\"object\\\" || typeof child === \\\"function\\\")) {\\n\\t\\t\\t\\tvar d = 1 + computeMaxDepth(child, limit - 1);\\n\\t\\t\\t\\tif(d > deepest) {\\n\\t\\t\\t\\t\\tdeepest = d;\\n\\t\\t\\t\\t}\\n\\t\\t\\t}\\n\\t\\t} catch(e) {\\n\\t\\t\\t// skip\\n\\t\\t}\\n\\t}\\n\\treturn deepest;\\n}\\n\\nexports.init = init;\\nexports.checkWritable = checkWritable;\\nexports.isReadonly = isReadonly;\\nexports.getCheckPathAllowed = getCheckPathAllowed;\\nexports.buildTree = buildTree;\\nexports.parseAndRender = parseAndRender;\\nexports.formatSourcePos = formatSourcePos;\\nexports.formatFnSource = formatFnSource;\\nexports.inspectValue = inspectValue;\\nexports.computeMaxDepth = computeMaxDepth;\\nexports.MAX_FILTER_LENGTH = MAX_FILTER_LENGTH;\\nexports.MAX_TEXT_LENGTH = MAX_TEXT_LENGTH;\\n\",\"type\":\"application/javascript\",\"module-type\":\"library\"},\"$:/core/modules/commands/inspect/mcp-handlers.js\":{\"title\":\"$:/core/modules/commands/inspect/mcp-handlers.js\",\"text\":\"/*\\\\\\ntitle: $:/core/modules/commands/inspect/mcp-handlers.js\\ntype: application/javascript\\nmodule-type: library\\n\\nMCP tool handler implementations for TiddlyWiki MCP server.\\nDelegates to domain-specific handler modules in ./handlers/.\\n\\n\\\\*/\\n\\n\\\"use strict\\\";\\n\\nvar shared = require(\\\"$:/core/modules/commands/inspect/handlers/shared.js\\\");\\n\\n// Build tool map by merging all domain handler modules\\nvar toolMap = {};\\nvar modules = [\\n\\trequire(\\\"$:/core/modules/commands/inspect/handlers/crud.js\\\"),\\n\\trequire(\\\"$:/core/modules/commands/inspect/handlers/query.js\\\"),\\n\\trequire(\\\"$:/core/modules/commands/inspect/handlers/render.js\\\"),\\n\\trequire(\\\"$:/core/modules/commands/inspect/handlers/inspect.js\\\"),\\n\\trequire(\\\"$:/core/modules/commands/inspect/handlers/filesystem.js\\\")\\n];\\nfor(var i = 0; i \u003C modules.length; i++) {\\n\\tvar mod = modules[i];\\n\\tvar keys = Object.keys(mod);\\n\\tfor(var k = 0; k \u003C keys.length; k++) {\\n\\t\\ttoolMap[keys[k]] = mod[keys[k]];\\n\\t}\\n}\\n\\nfunction init(context) {\\n\\tshared.init(context);\\n}\\n\\nfunction handleToolCall(name, args) {\\n\\tvar handler = toolMap[name];\\n\\treturn handler ? handler(args) : null;\\n}\\n\\nexports.init = init;\\nexports.handleToolCall = handleToolCall;\\nexports.buildTree = shared.buildTree;\\n\",\"type\":\"application/javascript\",\"module-type\":\"library\"},\"$:/core/modules/commands/inspect/mcp-tools.js\":{\"title\":\"$:/core/modules/commands/inspect/mcp-tools.js\",\"text\":\"/*\\\\\\ntitle: $:/core/modules/commands/inspect/mcp-tools.js\\ntype: application/javascript\\nmodule-type: library\\n\\nMCP tool definitions (input schemas) for TiddlyWiki MCP server.\\n\\n\\\\*/\\n\\n\\\"use strict\\\";\\n\\nvar readTools = [\\n\\t{\\n\\t\\tname: \\\"get_tiddler\\\",\\n\\t\\tdescription: \\\"Get a tiddler's fields by title. Returns metadata only by default; set detailed=true to include the text field.\\\",\\n\\t\\tinputSchema: {\\n\\t\\t\\ttype: \\\"object\\\",\\n\\t\\t\\tproperties: {\\n\\t\\t\\t\\ttitle: { type: \\\"string\\\", description: \\\"The tiddler title\\\" },\\n\\t\\t\\t\\tformat: { type: \\\"string\\\", enum: [\\\"tid\\\", \\\"json\\\"], default: \\\"tid\\\", description: \\\"Output format\\\" },\\n\\t\\t\\t\\tdetailed: { type: \\\"boolean\\\", default: false, description: \\\"Include the text field\\\" }\\n\\t\\t\\t},\\n\\t\\t\\trequired: [\\\"title\\\"]\\n\\t\\t}\\n\\t},\\n\\t{\\n\\t\\tname: \\\"run_filter\\\",\\n\\t\\tdescription: \\\"Execute a TiddlyWiki filter expression. Returns matching titles, auto-grouped into a namespace tree for large result sets. Example: '[!is[system]search[hello]]'\\\",\\n\\t\\tinputSchema: {\\n\\t\\t\\ttype: \\\"object\\\",\\n\\t\\t\\tproperties: {\\n\\t\\t\\t\\tfilter: { type: \\\"string\\\", description: \\\"TiddlyWiki filter expression\\\" }\\n\\t\\t\\t},\\n\\t\\t\\trequired: [\\\"filter\\\"]\\n\\t\\t}\\n\\t},\\n\\t{\\n\\t\\tname: \\\"render_tiddler\\\",\\n\\t\\tdescription: \\\"Render an existing tiddler's content to plain text or HTML.\\\",\\n\\t\\tinputSchema: {\\n\\t\\t\\ttype: \\\"object\\\",\\n\\t\\t\\tproperties: {\\n\\t\\t\\t\\ttitle: { type: \\\"string\\\", description: \\\"The tiddler title to render\\\" },\\n\\t\\t\\t\\ttype: { type: \\\"string\\\", enum: [\\\"text/plain\\\", \\\"text/plain-formatted\\\", \\\"text/html\\\"], default: \\\"text/plain-formatted\\\", description: \\\"Output type\\\" }\\n\\t\\t\\t},\\n\\t\\t\\trequired: [\\\"title\\\"]\\n\\t\\t}\\n\\t},\\n\\t{\\n\\t\\tname: \\\"render_text\\\",\\n\\t\\tdescription: \\\"Render arbitrary wikitext to plain text, HTML, or parse tree. Has full context (global macros, procedures). Action widgets do NOT execute server-side.\\\",\\n\\t\\tinputSchema: {\\n\\t\\t\\ttype: \\\"object\\\",\\n\\t\\t\\tproperties: {\\n\\t\\t\\t\\ttext: { type: \\\"string\\\", description: \\\"The wikitext to render\\\" },\\n\\t\\t\\t\\ttype: { type: \\\"string\\\", default: \\\"text/vnd.tiddlywiki\\\", description: \\\"Input text type\\\" },\\n\\t\\t\\t\\toutput: { type: \\\"string\\\", enum: [\\\"text/plain\\\", \\\"text/plain-formatted\\\", \\\"text/html\\\", \\\"parsetree\\\"], default: \\\"text/plain\\\", description: \\\"Output type. parsetree=JSON parse tree before macro expansion.\\\" },\\n\\t\\t\\t\\tcontext: { type: \\\"string\\\", description: \\\"Tiddler title to use as context (sets currentTiddler)\\\" },\\n\\t\\t\\t\\texclude: { type: \\\"array\\\", items: { type: \\\"string\\\" }, description: \\\"Keys to omit from parsetree (e.g. ['start','end'])\\\" },\\n\\t\\t\\t\\tinclude: { type: \\\"array\\\", items: { type: \\\"string\\\" }, description: \\\"Keys to unfold in parsetree. 'text' is compact by default — use ['text'] to expand.\\\" }\\n\\t\\t\\t},\\n\\t\\t\\trequired: [\\\"text\\\"]\\n\\t\\t}\\n\\t},\\n\\t{\\n\\t\\tname: \\\"inspect_tree\\\",\\n\\t\\tdescription: \\\"Analyze the rendered widget tree structure. Returns type counts, link targets, transclusion tracking, and depth-limited JSON. Summary always reflects the full tree.\\\",\\n\\t\\tinputSchema: {\\n\\t\\t\\ttype: \\\"object\\\",\\n\\t\\t\\tproperties: {\\n\\t\\t\\t\\ttext: { type: \\\"string\\\", description: \\\"The wikitext to analyze\\\" },\\n\\t\\t\\t\\ttype: { type: \\\"string\\\", default: \\\"text/vnd.tiddlywiki\\\", description: \\\"Input text type\\\" },\\n\\t\\t\\t\\tcontext: { type: \\\"string\\\", description: \\\"Context tiddler (sets currentTiddler)\\\" },\\n\\t\\t\\t\\texclude: { type: \\\"array\\\", items: { type: \\\"string\\\" }, description: \\\"Attribute names to omit from the tree\\\" },\\n\\t\\t\\t\\tinclude: { type: \\\"array\\\", items: { type: \\\"string\\\" }, description: \\\"Keys to unfold. 'text' is compact by default — use ['text'] to expand.\\\" },\\n\\t\\t\\t\\tdepth: { type: \\\"number\\\", default: 3, description: \\\"Max depth for tree JSON output\\\" }\\n\\t\\t\\t},\\n\\t\\t\\trequired: [\\\"text\\\"]\\n\\t\\t}\\n\\t},\\n\\t{\\n\\t\\tname: \\\"inspect_pos\\\",\\n\\t\\tdescription: \\\"Render wikitext to HTML with data-source-pos attributes on every element and link. Format: 'L{start}-L{end} @ tiddler' or 'L{line} @ tiddler'. Line numbers are file-ready. Use with inspect_scope to examine variables at specific positions.\\\",\\n\\t\\tinputSchema: {\\n\\t\\t\\ttype: \\\"object\\\",\\n\\t\\t\\tproperties: {\\n\\t\\t\\t\\ttext: { type: \\\"string\\\", description: \\\"The wikitext to render\\\" },\\n\\t\\t\\t\\ttype: { type: \\\"string\\\", default: \\\"text/vnd.tiddlywiki\\\", description: \\\"Input text type\\\" },\\n\\t\\t\\t\\tcontext: { type: \\\"string\\\", description: \\\"Context tiddler (sets currentTiddler)\\\" }\\n\\t\\t\\t},\\n\\t\\t\\trequired: [\\\"text\\\"]\\n\\t\\t}\\n\\t},\\n\\t{\\n\\t\\tname: \\\"get_wiki_info\\\",\\n\\t\\tdescription: \\\"Get wiki metadata: title, TW version, tiddler/tag/shadow counts, plugins, themes, and settings.\\\",\\n\\t\\tinputSchema: {\\n\\t\\t\\ttype: \\\"object\\\",\\n\\t\\t\\tproperties: {},\\n\\t\\t\\trequired: []\\n\\t\\t}\\n\\t},\\n\\t{\\n\\t\\tname: \\\"list_tiddlers\\\",\\n\\t\\tdescription: \\\"List tiddler titles grouped into a namespace tree. Supports filtering by tag, plugin, or overwritten shadows.\\\",\\n\\t\\tinputSchema: {\\n\\t\\t\\ttype: \\\"object\\\",\\n\\t\\t\\tproperties: {\\n\\t\\t\\t\\ttag: { type: \\\"string\\\", description: \\\"Filter by tag\\\" },\\n\\t\\t\\t\\tplugin: { type: \\\"string\\\", description: \\\"List subtiddlers of a plugin (e.g. '$:/plugins/tiddlywiki/internals')\\\" },\\n\\t\\t\\t\\toverwrittenShadows: { type: \\\"boolean\\\", default: false, description: \\\"List shadow tiddlers overwritten by real tiddlers\\\" },\\n\\t\\t\\t\\tlimit: { type: \\\"number\\\", default: 100, description: \\\"Max results\\\" },\\n\\t\\t\\t\\tincludeSystem: { type: \\\"boolean\\\", default: false, description: \\\"Include system tiddlers\\\" }\\n\\t\\t\\t},\\n\\t\\t\\trequired: []\\n\\t\\t}\\n\\t},\\n\\t{\\n\\t\\tname: \\\"reload_tiddlers\\\",\\n\\t\\tdescription: \\\"Re-read tiddlers from the filesystem, refreshing the in-memory store. Use after external file changes.\\\",\\n\\t\\tinputSchema: {\\n\\t\\t\\ttype: \\\"object\\\",\\n\\t\\t\\tproperties: {},\\n\\t\\t\\trequired: []\\n\\t\\t}\\n\\t},\\n\\t{\\n\\t\\tname: \\\"inspect_tw\\\",\\n\\t\\tdescription: \\\"Navigate TiddlyWiki's internal $tw object. Returns keys with types/values at the given path. Start with depth=1, then go deeper based on maxDepth in the response.\\\",\\n\\t\\tinputSchema: {\\n\\t\\t\\ttype: \\\"object\\\",\\n\\t\\t\\tproperties: {\\n\\t\\t\\t\\tpath: { type: \\\"string\\\", default: \\\"\\\", description: \\\"Dot-separated path (e.g. 'wiki', 'boot', 'config.preferences'). Empty=top-level.\\\" },\\n\\t\\t\\t\\tcall: { type: \\\"array\\\", items: { type: \\\"string\\\" }, description: \\\"Call the function at path with these arguments and inspect the result. E.g. path='wiki.getTiddler', call=['HelloThere'].\\\" },\\n\\t\\t\\t\\tdepth: { type: \\\"number\\\", default: 1, description: \\\"Levels deep to inspect. Start at 1.\\\" },\\n\\t\\t\\t\\tfullSource: { type: \\\"boolean\\\", default: false, description: \\\"Show full function source instead of first 5 lines.\\\" },\\n\\t\\t\\t\\texclude: { type: \\\"array\\\", items: { type: \\\"string\\\" }, description: \\\"Key names to skip (for circular refs or excessive output).\\\" }\\n\\t\\t\\t},\\n\\t\\t\\trequired: []\\n\\t\\t}\\n\\t},\\n\\t{\\n\\t\\tname: \\\"inspect_scope\\\",\\n\\t\\tdescription: \\\"Inspect the variable scope at a specific source position in rendered wikitext. Takes a tiddler title, renders it, finds the widget at the given character position, and returns all variables in scope (procedure params, let bindings, set variables, globals). Use data-source-pos values from positionMap output. By default shows only local scope and used globals; set all=true for the full list.\\\",\\n\\t\\tinputSchema: {\\n\\t\\t\\ttype: \\\"object\\\",\\n\\t\\t\\tproperties: {\\n\\t\\t\\t\\ttiddler: { type: \\\"string\\\", description: \\\"Tiddler title to render (the @tiddler from data-source-pos)\\\" },\\n\\t\\t\\t\\tcharPos: { type: \\\"number\\\", description: \\\"Character position within the tiddler's text field (the start number from data-source-pos)\\\" },\\n\\t\\t\\t\\ttext: { type: \\\"string\\\", description: \\\"Wikitext to render instead of a tiddler (for inline snippets)\\\" },\\n\\t\\t\\t\\tcontext: { type: \\\"string\\\", description: \\\"Context tiddler (sets currentTiddler)\\\" },\\n\\t\\t\\t\\tmatch: { type: \\\"object\\\", description: \\\"Match widget by variable values to disambiguate repeated positions (e.g. {\\\\\\\"currentTiddler\\\\\\\": \\\\\\\"Quick Start: Desktop\\\\\\\"})\\\", additionalProperties: { type: \\\"string\\\" } },\\n\\t\\t\\t\\tfilter: { type: \\\"string\\\", description: \\\"Only show variables matching this substring\\\" },\\n\\t\\t\\t\\tlimit: { type: \\\"number\\\", default: 20, description: \\\"Max variables to show (default 20)\\\" },\\n\\t\\t\\t\\tall: { type: \\\"boolean\\\", default: false, description: \\\"Show all variables including unused globals (default: local + used only)\\\" },\\n\\t\\t\\t\\trenderContext: { type: \\\"string\\\", enum: [\\\"isolated\\\", \\\"viewtemplate\\\", \\\"root\\\"], default: \\\"isolated\\\", description: \\\"Widget tree context: 'isolated' (default, just the tiddler), 'viewtemplate' (adds storyTiddler, tiddlerInfoState, folded-state), 'root' (full UI chain: navigator vars, toolbar config, language)\\\" }\\n\\t\\t\\t},\\n\\t\\t\\trequired: []\\n\\t\\t}\\n\\t}\\n];\\n\\nvar writeTools = [\\n\\t{\\n\\t\\tname: \\\"put_tiddler\\\",\\n\\t\\tdescription: \\\"Create or update a tiddler. Persists to disk as a .tid file. Set overwrite=true to replace existing tiddlers; without it, a new unique title is generated if the tiddler exists.\\\",\\n\\t\\tinputSchema: {\\n\\t\\t\\ttype: \\\"object\\\",\\n\\t\\t\\tproperties: {\\n\\t\\t\\t\\ttitle: { type: \\\"string\\\", description: \\\"The tiddler title\\\" },\\n\\t\\t\\t\\tfields: {\\n\\t\\t\\t\\t\\ttype: \\\"object\\\",\\n\\t\\t\\t\\t\\tdescription: \\\"Tiddler fields (text, tags, type, etc.)\\\",\\n\\t\\t\\t\\t\\tadditionalProperties: true\\n\\t\\t\\t\\t},\\n\\t\\t\\t\\toverwrite: { type: \\\"boolean\\\", default: false, description: \\\"Confirm overwriting an existing tiddler\\\" }\\n\\t\\t\\t},\\n\\t\\t\\trequired: [\\\"title\\\", \\\"fields\\\"]\\n\\t\\t}\\n\\t},\\n\\t{\\n\\t\\tname: \\\"delete_tiddler\\\",\\n\\t\\tdescription: \\\"Delete a tiddler from the store and remove its .tid file from disk.\\\",\\n\\t\\tinputSchema: {\\n\\t\\t\\ttype: \\\"object\\\",\\n\\t\\t\\tproperties: {\\n\\t\\t\\t\\ttitle: { type: \\\"string\\\", description: \\\"The tiddler title to delete\\\" }\\n\\t\\t\\t},\\n\\t\\t\\trequired: [\\\"title\\\"]\\n\\t\\t}\\n\\t},\\n\\t{\\n\\t\\tname: \\\"save_wiki_folder\\\",\\n\\t\\tdescription: \\\"Save the wiki as a folder structure to a specified path. Target directory must be empty or non-existent.\\\",\\n\\t\\tinputSchema: {\\n\\t\\t\\ttype: \\\"object\\\",\\n\\t\\t\\tproperties: {\\n\\t\\t\\t\\tpath: { type: \\\"string\\\", description: \\\"Output directory path\\\" },\\n\\t\\t\\t\\tfilter: { type: \\\"string\\\", default: \\\"[all[tiddlers]]\\\", description: \\\"Filter for tiddlers to include\\\" },\\n\\t\\t\\t\\texplodePlugins: { type: \\\"string\\\", enum: [\\\"yes\\\", \\\"no\\\"], default: \\\"yes\\\", description: \\\"Explode plugins into individual tiddlers\\\" }\\n\\t\\t\\t},\\n\\t\\t\\trequired: [\\\"path\\\"]\\n\\t\\t}\\n\\t},\\n\\t{\\n\\t\\tname: \\\"build_wiki\\\",\\n\\t\\tdescription: \\\"Render the wiki as a single HTML file.\\\",\\n\\t\\tinputSchema: {\\n\\t\\t\\ttype: \\\"object\\\",\\n\\t\\t\\tproperties: {\\n\\t\\t\\t\\toutput: { type: \\\"string\\\", description: \\\"Output file path\\\" },\\n\\t\\t\\t\\ttemplate: { type: \\\"string\\\", default: \\\"$:/core/save/all\\\", description: \\\"Template tiddler to render\\\" }\\n\\t\\t\\t},\\n\\t\\t\\trequired: [\\\"output\\\"]\\n\\t\\t}\\n\\t},\\n\\t{\\n\\t\\tname: \\\"upload_file\\\",\\n\\t\\tdescription: \\\"Upload a base64-encoded file to the wiki's files/ directory and create a canonical tiddler referencing it.\\\",\\n\\t\\tinputSchema: {\\n\\t\\t\\ttype: \\\"object\\\",\\n\\t\\t\\tproperties: {\\n\\t\\t\\t\\tfilename: { type: \\\"string\\\", description: \\\"Filename (e.g. 'photo.png'). No path separators.\\\" },\\n\\t\\t\\t\\tdata: { type: \\\"string\\\", description: \\\"Base64-encoded file content\\\" },\\n\\t\\t\\t\\ttype: { type: \\\"string\\\", description: \\\"MIME type (e.g. 'image/png')\\\" },\\n\\t\\t\\t\\ttitle: { type: \\\"string\\\", description: \\\"Tiddler title (defaults to filename)\\\" },\\n\\t\\t\\t\\ttags: { type: \\\"string\\\", description: \\\"Space-separated tags\\\" },\\n\\t\\t\\t\\tsubfolder: { type: \\\"string\\\", description: \\\"Subfolder within files/ (e.g. 'images')\\\" }\\n\\t\\t\\t},\\n\\t\\t\\trequired: [\\\"filename\\\", \\\"data\\\", \\\"type\\\"]\\n\\t\\t}\\n\\t}\\n];\\n\\nfunction getToolDefinitions(isReadonly) {\\n\\tif(isReadonly) {\\n\\t\\treturn readTools;\\n\\t}\\n\\treturn readTools.concat(writeTools);\\n}\\n\\nexports.readTools = readTools;\\nexports.writeTools = writeTools;\\nexports.getToolDefinitions = getToolDefinitions;\\n\",\"type\":\"application/javascript\",\"module-type\":\"library\"},\"$:/core/modules/commands/inspect/mcp.js\":{\"title\":\"$:/core/modules/commands/inspect/mcp.js\",\"text\":\"/*\\\\\\ntitle: $:/core/modules/commands/inspect/mcp.js\\ntype: application/javascript\\nmodule-type: library\\n\\nZero-dependency MCP (Model Context Protocol) server for TiddlyWiki.\\nImplements JSON-RPC 2.0 over stdio transport.\\n\\n\\\\*/\\n\\n\\\"use strict\\\";\\n\\nvar fs = require(\\\"fs\\\"),\\n\\tpath = require(\\\"path\\\"),\\n\\tnet = require(\\\"net\\\"),\\n\\tcrypto = require(\\\"crypto\\\");\\n\\nvar tools = require(\\\"$:/core/modules/commands/inspect/mcp-tools.js\\\");\\nvar handlers = require(\\\"$:/core/modules/commands/inspect/mcp-handlers.js\\\");\\n\\nvar PROTOCOL_VERSION = \\\"2025-03-26\\\";\\nvar SERVER_NAME = \\\"tiddlywiki-mcp\\\";\\nvar SERVER_VERSION = \\\"0.2.0\\\";\\n\\nvar readonlyMode = false;\\nvar allowedPaths = null; // null = no restriction, array of absolute paths = restrict output to these directories\\nvar authToken = null; // generated at startup for pipe transport authentication\\nvar serverLabel = null; // optional user-defined label to identify this instance\\nvar pipeClients = {}; // clientId -> { send, socket } — authenticated pipe clients\\nvar currentPipeServer = null; // reference to the active net.Server for the pipe\\nvar takeoverInProgress = false; // guard against concurrent takeover requests\\n\\n// --- Path validation helpers ---\\n\\nfunction isPathAllowed(targetPath) {\\n\\tif(!allowedPaths || allowedPaths.length === 0) {\\n\\t\\treturn true;\\n\\t}\\n\\t// Normalize separators for consistent comparison (Windows can mix / and \\\\)\\n\\tvar resolved = path.resolve(targetPath).replace(/\\\\\\\\/g, \\\"/\\\");\\n\\tfor(var i = 0; i \u003C allowedPaths.length; i++) {\\n\\t\\tvar allowed = path.resolve(allowedPaths[i]).replace(/\\\\\\\\/g, \\\"/\\\");\\n\\t\\t// Ensure allowed ends without trailing slash for consistent prefix matching\\n\\t\\tif(allowed.length > 1 && allowed.charAt(allowed.length - 1) === \\\"/\\\") {\\n\\t\\t\\tallowed = allowed.slice(0, -1);\\n\\t\\t}\\n\\t\\t// Check that target is inside or equal to an allowed directory\\n\\t\\tif(resolved === allowed || resolved.indexOf(allowed + \\\"/\\\") === 0) {\\n\\t\\t\\treturn true;\\n\\t\\t}\\n\\t}\\n\\treturn false;\\n}\\n\\nfunction checkPathAllowed(targetPath) {\\n\\tprocess.stderr.write(\\\"[tw-mcp] checkPathAllowed: \\\" + path.resolve(targetPath) + \\\" | allowedPaths: \\\" + JSON.stringify(allowedPaths) + \\\" | result: \\\" + (isPathAllowed(targetPath) ? \\\"ALLOWED\\\" : \\\"BLOCKED\\\") + \\\"\\\\n\\\");\\n\\tif(!isPathAllowed(targetPath)) {\\n\\t\\treturn {\\n\\t\\t\\tisError: true,\\n\\t\\t\\tcontent: [{ type: \\\"text\\\", text: \\\"Path not allowed: \\\" + path.resolve(targetPath) + \\\". Allowed directories: \\\" + allowedPaths.join(\\\", \\\") }]\\n\\t\\t};\\n\\t}\\n\\treturn null;\\n}\\n\\n// --- JSON-RPC helpers ---\\n\\nfunction jsonrpcResponse(id, result) {\\n\\treturn JSON.stringify({ jsonrpc: \\\"2.0\\\", id: id, result: result });\\n}\\n\\nfunction jsonrpcError(id, code, message, data) {\\n\\tvar err = { jsonrpc: \\\"2.0\\\", id: id, error: { code: code, message: message } };\\n\\tif(data !== undefined) {\\n\\t\\terr.error.data = data;\\n\\t}\\n\\treturn JSON.stringify(err);\\n}\\n\\n// --- MCP Server ---\\n\\n// --- Shared message dispatcher (used by stdio and pipe transports) ---\\n\\nfunction log(msg) {\\n\\tprocess.stderr.write(\\\"[tw-mcp] \\\" + msg + \\\"\\\\n\\\");\\n}\\n\\nfunction dispatchMessage(line, send) {\\n\\tvar parsed;\\n\\ttry {\\n\\t\\tparsed = JSON.parse(line);\\n\\t} catch(e) {\\n\\t\\tsend(jsonrpcError(null, -32700, \\\"Parse error\\\"));\\n\\t\\treturn;\\n\\t}\\n\\n\\t// Notifications have no id — no response needed\\n\\tif(parsed.id === undefined || parsed.id === null) {\\n\\t\\tif(parsed.method === \\\"notifications/initialized\\\") {\\n\\t\\t\\tlog(\\\"Client initialized\\\");\\n\\t\\t} else if(parsed.method === \\\"notifications/cancelled\\\") {\\n\\t\\t\\tlog(\\\"Request cancelled: \\\" + JSON.stringify(parsed.params));\\n\\t\\t} else if(parsed.method === \\\"notifications/takeover-request\\\") {\\n\\t\\t\\thandleTakeoverRequest(parsed.params);\\n\\t\\t}\\n\\t\\treturn;\\n\\t}\\n\\n\\tvar id = parsed.id;\\n\\tvar method = parsed.method;\\n\\n\\tswitch(method) {\\n\\t\\tcase \\\"initialize\\\":\\n\\t\\t\\tsend(jsonrpcResponse(id, {\\n\\t\\t\\t\\tprotocolVersion: PROTOCOL_VERSION,\\n\\t\\t\\t\\tcapabilities: {\\n\\t\\t\\t\\t\\ttools: {}\\n\\t\\t\\t\\t},\\n\\t\\t\\t\\tserverInfo: {\\n\\t\\t\\t\\t\\tname: SERVER_NAME,\\n\\t\\t\\t\\t\\tversion: SERVER_VERSION\\n\\t\\t\\t\\t},\\n\\t\\t\\t\\tinstructions: \\\"TiddlyWiki MCP server.\\\" +\\n\\t\\t\\t\\t\\t(readonlyMode ? \\\" READONLY mode — write tools are disabled.\\\" : \\\"\\\") +\\n\\t\\t\\t\\t\\t\\\"\\\\n\\\\n## Safety (CRITICAL)\\\\n\\\" +\\n\\t\\t\\t\\t\\t\\\"- NEVER modify, create, or delete tiddlers unless the user EXPLICITLY asks (create, edit, update, delete, rename, tag, untag). Words like 'list', 'show', 'find', 'search' are read-only — never write.\\\\n\\\" +\\n\\t\\t\\t\\t\\t\\\"- Before bulk operations, list affected tiddlers and ask for confirmation.\\\\n\\\" +\\n\\t\\t\\t\\t\\t\\\"- Always use get_tiddler to check existence before overwriting.\\\\n\\\" +\\n\\t\\t\\t\\t\\t\\\"\\\\n## System tiddlers\\\\n\\\" +\\n\\t\\t\\t\\t\\t\\\"- Exclude system tiddlers ('$:/') by default. Add '!is[system]' as the FIRST filter operator unless the user explicitly requests system/shadow tiddlers.\\\\n\\\" +\\n\\t\\t\\t\\t\\t\\\"- Never fetch '$:/core/modules/...' source tiddlers unless the user specifically names one.\\\\n\\\" +\\n\\t\\t\\t\\t\\t\\\"- Shadow tiddler fallback: if 2-3 searches fail, widen with '[all[tiddlers+shadows)]'. Many important tiddlers are shadows.\\\\n\\\" +\\n\\t\\t\\t\\t\\t\\\"- To list shadows by prefix: '[all[shadows+tiddlers)prefix[$:/config/]]'. Do NOT use shadowsource[].\\\\n\\\" +\\n\\t\\t\\t\\t\\t\\\"\\\\n## Token efficiency\\\\n\\\" +\\n\\t\\t\\t\\t\\t\\\"- Tool results are pre-formatted. Present them DIRECTLY — do not reformat, number, or restructure.\\\\n\\\" +\\n\\t\\t\\t\\t\\t\\\"- When reproducing tiddler logic, reproduce ALL elements — never skip or summarize.\\\\n\\\" +\\n\\t\\t\\t\\t\\t\\\"- Prefer MCP tools for rendering, filters, inspect_tw, wiki info. Prefer file access (Read/Grep/Glob) for code search and .tid files.\\\\n\\\" +\\n\\t\\t\\t\\t\\t\\\"\\\\n## Filter best practices\\\\n\\\" +\\n\\t\\t\\t\\t\\t\\\"- Put narrowing operators first: '[!is[system]search[x]]' not '[search[x]!is[system]]'.\\\\n\\\" +\\n\\t\\t\\t\\t\\t\\\"- Overwritten shadows: '[is[tiddler]is[shadow]]'. Plugin subtiddlers: '[[plugin]plugintiddlers[]]'.\\\\n\\\" +\\n\\t\\t\\t\\t\\t\\\"\\\\n## Structural analysis\\\\n\\\" +\\n\\t\\t\\t\\t\\t\\\"- Use inspect_tree to count elements ( eeds \\\" + (MAX_BUFFER_SIZE / 1024 / 1024) + \\\"MB, dropping connection\\\");\\n\\t\\t\\tbuffer = \\\"\\\";\\n\\t\\t\\tinput.destroy();\\n\\t\\t\\treturn;\\n\\t\\t}\\n\\t\\tvar lines = buffer.split(\\\"\\\\n\\\");\\n\\t\\tbuffer = lines.pop();\\n\\t\\tfor(var i = 0; i \u003C lines.length; i++) {\\n\\t\\t\\tvar line = lines[i].trim();\\n\\t\\t\\tif(line) {\\n\\t\\t\\t\\tdispatch(line, send);\\n\\t\\t\\t}\\n\\t\\t}\\n\\t});\\n\\tinput.on(\\\"end\\\", function() {\\n\\t\\tif(onClose) {\\n\\t\\t\\tonClose();\\n\\t\\t}\\n\\t});\\n}\\n\\n// --- Named pipe transport ---\\n\\n// Resolve the canonical wiki path by following includeWikis to the root.\\n// e.g. tw5.com-server includes ../tw5.com → canonical path is tw5.com.\\n// The pipe name and discovery file are based on this so all editions converge.\\nfunction getCanonicalWikiPath() {\\n\\tvar wikiPath = $tw.boot.wikiPath;\\n\\tif(!wikiPath) {\\n\\t\\treturn null;\\n\\t}\\n\\ttry {\\n\\t\\tvar infoPath = path.resolve(wikiPath, \\\"tiddlywiki.info\\\");\\n\\t\\tvar info = JSON.parse(fs.readFileSync(infoPath, \\\"utf8\\\"));\\n\\t\\tif(info.includeWikis && info.includeWikis.length > 0) {\\n\\t\\t\\tvar first = info.includeWikis[0];\\n\\t\\t\\tvar includePath = typeof first === \\\"string\\\" ? first : first.path;\\n\\t\\t\\treturn path.resolve(wikiPath, includePath);\\n\\t\\t}\\n\\t} catch(e) {\\n\\t\\t// tiddlywiki.info doesn't exist or is unreadable\\n\\t}\\n\\treturn wikiPath;\\n}\\n\\nfunction getPipePath() {\\n\\tvar canonical = getCanonicalWikiPath() || \\\"default\\\";\\n\\tif(process.platform === \\\"win32\\\") {\\n\\t\\t// Windows named pipe — use wiki path hash for uniqueness\\n\\t\\tvar wikiId = canonical.replace(/[^a-zA-Z0-9]/g, \\\"-\\\");\\n\\t\\treturn \\\"\\\\\\\\\\\\\\\\.\\\\\\\\pipe\\\\\\\\tiddlywiki-mcp-\\\" + wikiId;\\n\\t} else {\\n\\t\\t// Unix domain socket in the canonical wiki directory\\n\\t\\treturn path.resolve(canonical, \\\".mcp.sock\\\");\\n\\t}\\n}\\n\\nfunction isProcessRunning(pid) {\\n\\ ":{\"title\":\"E:\\\\git\\\\tiddly\\\\tiddlywiki\\\\TiddlyWiki5\\\\core-server\\\\commands\\\\inspect\\\\sidecar\\\\tw-upload.js\",\"text\":\"#!/usr/bin/env node\\n\\n/*\\ntw-upload: CLI tool to upload binary files to a running TiddlyWiki MCP server.\\n\\nConnects to the MCP server via named pipe, reads an image (JPG, PNG, GIF)\\nor PDF file, base64-encodes it, and calls the upload_file tool.\\n\\nUsage:\\n  node tw-upload.js \u003Cfile> [--wiki \u003Cpath>] [--title \u003Ctitle>] [--tags \u003Ctags>] [--subfolder \u003Cdir>]\\n\\nExamples:\\n  node tw-upload.js photo.png --wiki ./editions/tw5.com\\n  node tw-upload.js doc.pdf --title \\\"My Document\\\" --tags \\\"docs reference\\\"\\n  node tw-upload.js icon.gif --subfolder images\\n\\nThe --wiki option specifies the wiki directory to find the .tw-mcp/connect discovery file.\\nIf omitted, the current directory is used.\\n*/\\n\\n\\\"use strict\\\";\\n\\nvar fs = require(\\\"fs\\\");\\nvar path = require(\\\"path\\\");\\nvar net = require(\\\"net\\\");\\n\\n// Allowed file types\\nvar ALLOWED_TYPES = {\\n\\t\\\".png\\\":  \\\"image/png\\\",\\n\\t\\\".jpg\\\":  \\\"image/jpeg\\\",\\n\\t\\\".jpeg\\\": \\\"image/jpeg\\\",\\n\\t\\\".gif\\\":  \\\"image/gif\\\",\\n\\t\\\".pdf\\\":  \\\"application/pdf\\\"\\n};\\n\\nvar MAX_FILE_SIZE = 50 * 1024 * 1024; // 50MB\\n\\n// Strip terminal escape sequences from server responses to prevent terminal injection\\nfunction sanitizeOutput(text) {\\n\\tif(typeof text !== \\\"string\\\") return \\\"\\\";\\n\\t// Remove ANSI escape codes and other control characters (keep newlines and tabs)\\n\\treturn text.replace(/[\\\\x00-\\\\x08\\\\x0B\\\\x0C\\\\x0E-\\\\x1F\\\\x7F]|\\\\x1B\\\\[[0-9;]*[a-zA-Z]|\\\\x1B\\\\].*?\\\\x07/g, \\\"\\\");\\n}\\n\\nfunction parseArgs(argv) {\\n\\tvar args = { file: null, wiki: \\\".\\\", title: null, tags: null, subfolder: null };\\n\\tvar i = 2; // skip node and script\\n\\twhile(i \u003C argv.length) {\\n\\t\\tswitch(argv[i]) {\\n\\t\\t\\tcase \\\"--wiki\\\":\\n\\t\\t\\t\\targs.wiki = argv[++i];\\n\\t\\t\\t\\tbreak;\\n\\t\\t\\tcase \\\"--title\\\":\\n\\t\\t\\t\\targs.title = argv[++i];\\n\\t\\t\\t\\tbreak;\\n\\t\\t\\tcase \\\"--tags\\\":\\n\\t\\t\\t\\targs.tags = argv[++i];\\n\\t\\t\\t\\tbreak;\\n\\t\\t\\tcase \\\"--subfolder\\\":\\n\\t\\t\\t\\targs.subfolder = argv[++i];\\n\\t\\t\\t\\tbreak;\\n\\t\\t\\tcase \\\"--help\\\":\\n\\t\\t\\tcase \\\"-h\\\":\\n\\t\\t\\t\\tprintUsage();\\n\\t\\t\\t\\tprocess.exit(0);\\n\\t\\t\\t\\tbreak;\\n\\t\\t\\tdefault:\\n\\t\\t\\t\\tif(!args.file && argv[i][0] !== \\\"-\\\") {\\n\\t\\t\\t\\t\\targs.file = argv[i];\\n\\t\\t\\t\\t} else {\\n\\t\\t\\t\\t\\tconsole.error(\\\"Unknown option: \\\" + argv[i]);\\n\\t\\t\\t\\t\\tprocess.exit(1);\\n\\t\\t\\t\\t}\\n\\t\\t}\\n\\t\\ti++;\\n\\t}\\n\\treturn args;\\n}\\n\\nfunction printUsage() {\\n\\tconsole.log(\\\"Usage: tw-upload \u003Cfile> [--wiki \u003Cpath>] [--title \u003Ctitle>] [--tags \u003Ctags>] [--subfolder \u003Cdir>]\\\");\\n\\tconsole.log(\\\"\\\");\\n\\tconsole.log(\\\"Uploads a binary file (PNG, JPG, GIF, PDF) to a running TiddlyWiki MCP server.\\\");\\n\\tconsole.log(\\\"Connects via named pipe (the MCP server must be running with --mcp).\\\");\\n\\tconsole.log(\\\"\\\");\\n\\tconsole.log(\\\"Options:\\\");\\n\\tconsole.log(\\\"  --wiki \u003Cpath>       Wiki directory to find .tw-mcp/connect (defaults to current dir)\\\");\\n\\tconsole.log(\\\"  --title \u003Ctitle>     Tiddler title (defaults to filename)\\\");\\n\\tconsole.log(\\\"  --tags \u003Ctags>       Space-separated tags for the tiddler\\\");\\n\\tconsole.log(\\\"  --subfolder \u003Cdir>   Subfolder within files/ to save to\\\");\\n\\tconsole.log(\\\"  -h, --help          Show this help message\\\");\\n\\tconsole.log(\\\"\\\");\\n\\tconsole.log(\\\"Supported formats: PNG, JPG, GIF, PDF (max 50MB)\\\");\\n}\\n\\nfunction sendJsonRpc(socket, id, method, params) {\\n\\tvar msg = JSON.stringify({ jsonrpc: \\\"2.0\\\", id: id, method: method, params: params || {} });\\n\\tsocket.write(msg + \\\"\\\\n\\\");\\n}\\n\\nfunction main() {\\n\\tvar args = parseArgs(process.argv);\\n\\n\\tif(!args.file) {\\n\\t\\tconsole.error(\\\"Error: No file specified.\\\");\\n\\t\\tprintUsage();\\n\\t\\tprocess.exit(1);\\n\\t}\\n\\n\\t// Validate file exists\\n\\tvar filePath = path.resolve(args.file);\\n\\tif(!fs.existsSync(filePath)) {\\n\\t\\tconsole.error(\\\"Error: File not found: \\\" + filePath);\\n\\t\\tprocess.exit(1);\\n\\t}\\n\\n\\t// Validate file type\\n\\tvar ext = path.extname(filePath).toLowerCase();\\n\\tvar mimeType = ALLOWED_TYPES[ext];\\n\\tif(!mimeType) {\\n\\t\\tconsole.error(\\\"Error: Unsupported file type '\\\" + ext + \\\"'. Allowed: \\\" + Object.keys(ALLOWED_TYPES).join(\\\", \\\"));\\n\\t\\tprocess.exit(1);\\n\\t}\\n\\n\\t// Validate file size\\n\\tvar stat = fs.statSync(filePath);\\n\\tif(stat.size > MAX_FILE_SIZE) {\\n\\t\\tconsole.error(\\\"Error: File too large (\\\" + Math.round(stat.size / 1024 / 1024) + \\\"MB). Max: 50MB\\\");\\n\\t\\tprocess.exit(1);\\n\\t}\\n\\n\\t// Discover pipe path\\n\\tvar wikiPath = path.resolve(args.wiki);\\n\\tvar discoveryFile = path.resolve(wikiPath, \\\".tw-mcp/connect\\\");\\n\\t// Parse discovery file (JSON format: { \\\"pipe\\\": \\\"...\\\", \\\"token\\\": \\\"...\\\" })\\n\\t// Clients should ignore unknown fields for forward compatibility\\n\\tvar pipePath, authToken;\\n\\ttry {\\n\\t\\tvar discoveryContent = fs.readFileSync(discoveryFile, \\\"utf8\\\").trim();\\n\\t\\tvar discovery = JSON.parse(discoveryContent);\\n\\t\\tpipePath = discovery.pipe;\\n\\t\\tauthToken = discovery.token;\\n\\t\\tif(!pipePath || typeof pipePath !== \\\"string\\\") {\\n\\t\\t\\tthrow new Error(\\\"missing 'pipe' field\\\");\\n\\t\\t}\\n\\t\\tif(!authToken || typeof authToken !== \\\"string\\\") {\\n\\t\\t\\tthrow new Error(\\\"missing 'token' field\\\");\\n\\t\\t}\\n\\t} catch(e) {\\n\\t\\tif(e.code === \\\"ENOENT\\\") {\\n\\t\\t\\tconsole.error(\\\"\\\\nNo MCP server found for wiki: \\\" + wikiPath);\\n\\t\\t\\tconsole.error(\\\"\\\\nThe .tw-mcp/connect discovery file does not exist.\\\");\\n\\t\\t\\tconsole.error(\\\"Start the MCP server first:\\\\n\\\");\\n\\t\\t\\tconsole.error(\\\"  tiddlywiki +plugins/tiddlywiki/filesystem \\\" + args.wiki + \\\" --mcp\\\\n\\\");\\n\\t\\t} else {\\n\\t\\t\\tconsole.error(\\\"\\\\nCould not read .tw-mcp/connect: \\\" + e.message);\\n\\t\\t\\tconsole.error(\\\"The file may be corrupted. Restart the MCP server:\\\\n\\\");\\n\\t\\t\\tconsole.error(\\\"  tiddlywiki +plugins/tiddlywiki/filesystem \\\" + args.wiki + \\\" --mcp\\\\n\\\");\\n\\t\\t}\\n\\t\\tprocess.exit(1);\\n\\t}\\n\\n\\t// Validate that the pipe path is a local named pipe, not an arbitrary network address\\n\\tif(process.platform === \\\"win32\\\") {\\n\\t\\tif(!pipePath.startsWith(\\\"\\\\\\\\\\\\\\\\.\\\\\\\\pipe\\\\\\\\\\\")) {\\n\\t\\t\\tconsole.error(\\\"Error: Invalid pipe path — must be a Windows named pipe (\\\\\\\\\\\\\\\\.\\\\\\\\pipe\\\\\\\\...)\\\");\\n\\t\\t\\tprocess.exit(1);\\n\\t\\t}\\n\\t} else {\\n\\t\\tif(!path.isAbsolute(pipePath)) {\\n\\t\\t\\tconsole.error(\\\"Error: Invalid pipe path — must be an absolute path to a Unix socket\\\");\\n\\t\\t\\tprocess.exit(1);\\n\\t\\t}\\n\\t}\\n\\n\\t// Read and encode\\n\\tvar filename = path.basename(filePath);\\n\\tconsole.log(\\\"Reading \\\" + filename + \\\" (\\\" + Math.round(stat.size / 1024) + \\\"KB, \\\" + mimeType + \\\")...\\\");\\n\\tvar data = fs.readFileSync(filePath).toString(\\\"base64\\\");\\n\\n\\t// Connect to MCP server via named pipe\\n\\tconsole.log(\\\"Connecting to MCP server: \\\" + pipePath);\\n\\n\\tvar socket = net.createConnection(pipePath, function() {\\n\\t\\tconsole.log(\\\"Connected.\\\");\\n\\t\\t// Send initialize request with auth token\\n\\t\\tsendJsonRpc(socket, 1, \\\"initialize\\\", {\\n\\t\\t\\tprotocolVersion: \\\"2025-03-26\\\",\\n\\t\\t\\tcapabilities: {},\\n\\t\\t\\tclientInfo: { name: \\\"tw-upload\\\", version: \\\"1.0.0\\\" },\\n\\t\\t\\t_auth_token: authToken\\n\\t\\t});\\n\\t});\\n\\n\\tvar buffer = \\\"\\\";\\n\\tvar messageCount = 0;\\n\\n\\tsocket.setEncoding(\\\"utf8\\\");\\n\\tsocket.on(\\\"data\\\", function(chunk) {\\n\\t\\tbuffer += chunk;\\n\\t\\tvar lines = buffer.split(\\\"\\\\n\\\");\\n\\t\\tbuffer = lines.pop();\\n\\t\\tlines.forEach(function(line) {\\n\\t\\t\\tline = line.trim();\\n\\t\\t\\tif(!line) return;\\n\\t\\t\\ttry {\\n\\t\\t\\t\\tvar response = JSON.parse(line);\\n\\t\\t\\t\\tmessageCount++;\\n\\t\\t\\t\\tif(messageCount === 1) {\\n\\t\\t\\t\\t\\t// Response to initialize — send notification, then upload\\n\\t\\t\\t\\t\\tsendJsonRpc(socket, null, \\\"notifications/initialized\\\");\\n\\t\\t\\t\\t\\tvar toolArgs = {\\n\\t\\t\\t\\t\\t\\tfilename: filename,\\n\\t\\t\\t\\t\\t\\tdata: data,\\n\\t\\t\\t\\t\\t\\ttype: mimeType\\n\\t\\t\\t\\t\\t};\\n\\t\\t\\t\\t\\tif(args.title) toolArgs.title = args.title;\\n\\t\\t\\t\\t\\tif(args.tags) toolArgs.tags = args.tags;\\n\\t\\t\\t\\t\\tif(args.subfolder) toolArgs.subfolder = args.subfolder;\\n\\t\\t\\t\\t\\tconsole.log(\\\"Uploading...\\\");\\n\\t\\t\\t\\t\\tsendJsonRpc(socket, 2, \\\"tools/call\\\", {\\n\\t\\t\\t\\t\\t\\tname: \\\"upload_file\\\",\\n\\t\\t\\t\\t\\t\\targuments: toolArgs\\n\\t\\t\\t\\t\\t});\\n\\t\\t\\t\\t} else if(messageCount === 2) {\\n\\t\\t\\t\\t\\t// Response to upload_file\\n\\t\\t\\t\\t\\tif(response.result && response.result.content) {\\n\\t\\t\\t\\t\\t\\tresponse.result.content.forEach(function(c) {\\n\\t\\t\\t\\t\\t\\t\\tvar text = sanitizeOutput(c.text);\\n\\t\\t\\t\\t\\t\\t\\tif(response.result.isError) {\\n\\t\\t\\t\\t\\t\\t\\t\\tconsole.error(\\\"Error: \\\" + text);\\n\\t\\t\\t\\t\\t\\t\\t} else {\\n\\t\\t\\t\\t\\t\\t\\t\\tconsole.log(text);\\n\\t\\t\\t\\t\\t\\t\\t}\\n\\t\\t\\t\\t\\t\\t});\\n\\t\\t\\t\\t\\t} else if(response.error) {\\n\\t\\t\\t\\t\\t\\tconsole.error(\\\"MCP Error: \\\" + sanitizeOutput(response.error.message));\\n\\t\\t\\t\\t\\t}\\n\\t\\t\\t\\t\\tsocket.end();\\n\\t\\t\\t\\t}\\n\\t\\t\\t} catch(e) {\\n\\t\\t\\t\\tconsole.error(\\\"Warning: Failed to parse server response: \\\" + e.message);\\n\\t\\t\\t}\\n\\t\\t});\\n\\t});\\n\\n\\tsocket.on(\\\"error\\\", function(err) {\\n\\t\\tconsole.error(\\\"Connection error: \\\" + err.message);\\n\\t\\tif(err.code === \\\"ENOENT\\\" || err.code === \\\"ECONNREFUSED\\\") {\\n\\t\\t\\tconsole.error(\\\"Is the MCP server running? Start it with: tiddlywiki +plugins/tiddlywiki/filesystem \u003Cwiki> --mcp\\\");\\n\\t\\t}\\n\\t\\tprocess.exit(1);\\n\\t});\\n\\n\\tsocket.on(\\\"close\\\", function() {\\n\\t\\tprocess.exit(0);\\n\\t});\\n}\\n\\nmain();\\n\"},\"$:/core/modules/commands/listen.js\":{\"title\":\"$:/core/modules/commands/listen.js\",\"text\":\"/*\\\\\\ntitle: $:/core/modules/commands/listen.js\\ntype: application/javascript\\nmodule-type: command\\n\\nListen for HTTP requests and serve tiddlers\\n\\n\\\\*/\\n\\n\\\"use strict\\\";\\n\\nvar Server = require(\\\"$:/core/modules/server/server.js\\\").Server;\\n\\nexports.info = {\\n\\tname: \\\"listen\\\",\\n\\tsynchronous: true,\\n\\tnamedParameterMode: true,\\n\\tmandatoryParameters: []\\n};\\n\\nvar Command = function(params,commander,callback) {\\n\\tthis.params = params;\\n\\tthis.commander = commander;\\n\\tthis.callback = callback;\\n};\\n\\nCommand.prototype.execute = function() {\\n\\tvar self = this;\\n\\tif(!$tw.boot.wikiTiddlersPath) {\\n\\t\\t$tw.utils.warning(\\\"Warning: Wiki folder '\\\" + $tw.boot.wikiPath + \\\"' does not exist or is missing a tiddlywiki.info file\\\");\\n\\t}\\n\\t// Set up server\\n\\tthis.server = new Server({\\n\\t\\twiki: this.commander.wiki,\\n\\t\\tvariables: self.params\\n\\t});\\n\\tvar nodeServer = this.server.listen();\\n\\t$tw.hooks.invokeHook(\\\"th-server-command-post-start\\\",this.server,nodeServer,\\\"tiddlywiki\\\");\\n\\treturn null;\\n};\\n\\nexports.Command = Command;\\n\",\"type\":\"application/javascript\",\"module-type\":\"command\"},\"$:/core/modules/commands/load.js\":{\"title\":\"$:/core/modules/commands/load.js\",\"text\":\"/*\\\\\\ntitle: $:/core/modules/commands/load.js\\ntype: application/javascript\\nmodule-type: command\\n\\nCommand to load tiddlers from a file or directory\\n\\n\\\\*/\\n\\n\\\"use strict\\\";\\n\\nexports.info = {\\n\\tname: \\\"load\\\",\\n\\tsynchronous: false\\n};\\n\\nvar Command = function(params,commander,callback) {\\n\\tthis.params = params;\\n\\tthis.commander = commander;\\n\\tthis.callback = callback;\\n};\\n\\nCommand.prototype.execute = function() {\\n\\tvar self = this;\\n\\tif(this.params.length \u003C 1) {\\n\\t\\treturn \\\"Missing filename\\\";\\n\\t}\\n\\tvar tiddlers = $tw.loadTiddlersFromPath(self.params[0]),\\n\\t\\tcount = 0;\\n\\t$tw.utils.each(tiddlers,function(tiddlerInfo) {\\n\\t\\t$tw.utils.each(tiddlerInfo.tiddlers,function(tiddler) {\\n\\t\\t\\tself.commander.wiki.importTiddler(new $tw.Tiddler(tiddler));\\n\\t\\t\\tcount++;\\n\\t\\t});\\n\\t});\\n\\tif(!count && self.params[1] !== \\\"noerror\\\") {\\n\\t\\tself.callback(\\\"No tiddlers found in file \\\\\\\"\\\" + self.params[0] + \\\"\\\\\\\"\\\");\\n\\t} else {\\n\\t\\tself.callback(null);\\n\\t}\\n\\treturn null;\\n};\\n\\nexports.Command = Command;\\n\",\"type\":\"application/javascript\",\"module-type\":\"command\"},\"$:/core/modules/commands/makelibrary.js\":{\"title\":\"$:/core/modules/commands/makelibrary.js\",\"text\":\"/*\\\\\\ntitle: $:/core/modules/commands/makelibrary.js\\ntype: application/javascript\\nmodule-type: command\\n\\nCommand to pack all of the plugins in the library into a plugin tiddler of type \\\"library\\\"\\n\\n\\\\*/\\n\\n\\\"use strict\\\";\\n\\nexports.info = {\\n\\tname: \\\"makelibrary\\\",\\n\\tsynchronous: true\\n};\\n\\nvar UPGRADE_LIBRARY_TITLE = \\\"$:/UpgradeLibrary\\\";\\n\\nvar Command = function(params,commander,callback) {\\n\\tthis.params = params;\\n\\tthis.commander = commander;\\n\\tthis.callback = callback;\\n};\\n\\nCommand.prototype.execute = function() {\\n\\tvar wiki = this.commander.wiki,\\n\\t\\tupgradeLibraryTitle = thi
