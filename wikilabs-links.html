",\"text\":\"/*! modern-normalize v2.0.0 | MIT License | https://github.com/sindresorhus/modern-normalize */\\n\\n/*\\nDocument\\n========\\n*/\\n\\n/**\\nUse a better box model (opinionated).\\n*/\\n\\n*,\\n::before,\\n::after {\\n\\tbox-sizing: border-box;\\n}\\n\\nhtml {\\n\\t/* Improve consistency of default fonts in all browsers. (https://github.com/sindresorhus/modern-normalize/issues/3) */\\n\\tfont-family:\\n\\t\\tsystem-ui,\\n\\t\\t'Segoe UI',\\n\\t\\tRoboto,\\n\\t\\tHelvetica,\\n\\t\\tArial,\\n\\t\\tsans-serif,\\n\\t\\t'Apple Color Emoji',\\n\\t\\t'Segoe UI Emoji';\\n\\tline-height: 1.15; /* 1. Correct the line height in all browsers. */\\n\\t-webkit-text-size-adjust: 100%; /* 2. Prevent adjustments of font size after orientation changes in iOS. */\\n\\t-moz-tab-size: 4; /* 3. Use a more readable tab size (opinionated). */\\n\\ttab-size: 4; /* 3 */\\n}\\n\\n/*\\nSections\\n========\\n*/\\n\\nbody {\\n\\tmargin: 0; /* Remove the margin in all browsers. */\\n}\\n\\n/*\\nGrouping content\\n================\\n*/\\n\\n/**\\n1. Add the correct height in Firefox.\\n2. Correct the inheritance of border color in Firefox. (https://bugzilla.mozilla.org/show_bug.cgi?id=190655)\\n*/\\n\\nhr {\\n\\theight: 0; /* 1 */\\n\\tcolor: inherit; /* 2 */\\n}\\n\\n/*\\nText-level semantics\\n====================\\n*/\\n\\n/**\\nAdd the correct text decoration in Chrome, Edge, and Safari.\\n*/\\n\\nabbr[title] {\\n\\ttext-decoration: underline dotted;\\n}\\n\\n/**\\nAdd the correct font weight in Edge and Safari.\\n*/\\n\\nb,\\nstrong {\\n\\tfont-weight: bolder;\\n}\\n\\n/**\\n1. Improve consistency of default fonts in all browsers. (https://github.com/sindresorhus/modern-normalize/issues/3)\\n2. Correct the odd 'em' font sizing in all browsers.\\n*/\\n\\ncode,\\nkbd,\\nsamp,\\npre {\\n\\tfont-family:\\n\\t\\tui-monospace,\\n\\t\\tSFMono-Regular,\\n\\t\\tConsolas,\\n\\t\\t'Liberation Mono',\\n\\t\\tMenlo,\\n\\t\\tmonospace; /* 1 */\\n\\tfont-size: 1em; /* 2 */\\n}\\n\\n/**\\nAdd the correct font size in all browsers.\\n*/\\n\\nsmall {\\n\\tfont-size: 80%;\\n}\\n\\n/**\\nPrevent 'sub' and 'sup' elements from affecting the line height in all browsers.\\n*/\\n\\nsub,\\nsup {\\n\\tfont-size: 75%;\\n\\tline-height: 0;\\n\\tposition: relative;\\n\\tvertical-align: baseline;\\n}\\n\\nsub {\\n\\tbottom: -0.25em;\\n}\\n\\nsup {\\n\\ttop: -0.5em;\\n}\\n\\n/*\\nTabular data\\n============\\n*/\\n\\n/**\\n1. Remove text indentation from table contents in Chrome and Safari. (https://bugs.chromium.org/p/chromium/issues/detail?id=999088, https://bugs.webkit.org/show_bug.cgi?id=201297)\\n2. Correct table border color inheritance in Chrome and Safari. (https://bugs.chromium.org/p/chromium/issues/detail?id=935729, https://bugs.webkit.org/show_bug.cgi?id=195016)\\n*/\\n\\ntable {\\n\\ttext-indent: 0; /* 1 */\\n\\tborder-color: inherit; /* 2 */\\n}\\n\\n/*\\nForms\\n=====\\n*/\\n\\n/**\\n1. Change the font styles in all browsers.\\n2. Remove the margin in Firefox and Safari.\\n*/\\n\\nbutton,\\ninput,\\noptgroup,\\nselect,\\ntextarea {\\n\\tfont-family: inherit; /* 1 */\\n\\tfont-size: 100%; /* 1 */\\n\\tline-height: 1.15; /* 1 */\\n\\tmargin: 0; /* 2 */\\n}\\n\\n/**\\nRemove the inheritance of text transform in Edge and Firefox.\\n*/\\n\\nbutton,\\nselect {\\n\\ttext-transform: none;\\n}\\n\\n/**\\nCorrect the inability to style clickable types in iOS and Safari.\\n*/\\n\\nbutton,\\n[type='button'],\\n[type='reset'],\\n[type='submit'] {\\n\\t-webkit-appearance: button;\\n}\\n\\n/**\\nRemove the inner border and padding in Firefox.\\n*/\\n\\n::-moz-focus-inner {\\n\\tborder-style: none;\\n\\tpadding: 0;\\n}\\n\\n/**\\nRestore the focus styles unset by the previous rule.\\n*/\\n\\n:-moz-focusring {\\n\\toutline: 1px dotted ButtonText;\\n}\\n\\n/**\\nRemove the additional ':invalid' styles in Firefox.\\nSee: https://github.com/mozilla/gecko-dev/blob/2f9eacd9d3d995c937b4251a5557d95d494c9be1/layout/style/res/forms.css#L728-L737\\n*/\\n\\n:-moz-ui-invalid {\\n\\tbox-shadow: none;\\n}\\n\\n/**\\nRemove the padding so developers are not caught out when they zero out 'fieldset' elements in all browsers.\\n*/\\n\\nlegend {\\n\\tpadding: 0;\\n}\\n\\n/**\\nAdd the correct vertical alignment in Chrome and Firefox.\\n*/\\n\\nprogress {\\n\\tvertical-align: baseline;\\n}\\n\\n/**\\nCorrect the cursor style of increment and decrement buttons in Safari.\\n*/\\n\\n::-webkit-inner-spin-button,\\n::-webkit-outer-spin-button {\\n\\theight: auto;\\n}\\n\\n/**\\n1. Correct the odd appearance in Chrome and Safari.\\n2. Correct the outline style in Safari.\\n*/\\n\\n[type='search'] {\\n\\t-webkit-appearance: textfield; /* 1 */\\n\\toutline-offset: -2px; /* 2 */\\n}\\n\\n/**\\nRemove the inner padding in Chrome and Safari on macOS.\\n*/\\n\\n::-webkit-search-decoration {\\n\\t-webkit-appearance: none;\\n}\\n\\n/**\\n1. Correct the inability to style clickable types in iOS and Safari.\\n2. Change font properties to 'inherit' in Safari.\\n*/\\n\\n::-webkit-file-upload-button {\\n\\t-webkit-appearance: button; /* 1 */\\n\\tfont: inherit; /* 2 */\\n}\\n\\n/*\\nInteractive\\n===========\\n*/\\n\\n/*\\nAdd the correct display in Chrome and Safari.\\n*/\\n\\nsummary {\\n\\tdisplay: list-item;\\n}\\n\"},\"$:/themes/tiddlywiki/vanilla/settings/fontfamily\":{\"title\":\"$:/themes/tiddlywiki/vanilla/settings/fontfamily\",\"text\":\"-apple-system, BlinkMacSystemFont, \\\"Segoe UI\\\", \\\"Noto Sans\\\", sans-serif, Helvetica, Arial, \\\"Apple Color Emoji\\\", \\\"Segoe UI Emoji\\\"\"},\"$:/themes/tiddlywiki/vanilla/settings/codefontfamily\":{\"title\":\"$:/themes/tiddlywiki/vanilla/settings/codefontfamily\",\"text\":\"ui-monospace, \\\"SFMono-Regular\\\", \\\"SF Mono\\\", Menlo, Consolas, \\\"Liberation Mono\\\", monospace\"},\"$:/themes/tiddlywiki/vanilla/settings/backgroundimageattachment\":{\"title\":\"$:/themes/tiddlywiki/vanilla/settings/backgroundimageattachment\",\"text\":\"fixed\"},\"$:/themes/tiddlywiki/vanilla/settings/backgroundimagesize\":{\"title\":\"$:/themes/tiddlywiki/vanilla/settings/backgroundimagesize\",\"text\":\"auto\"},\"$:/themes/tiddlywiki/vanilla/sticky\":{\"title\":\"$:/themes/tiddlywiki/vanilla/sticky\",\"code-body\":\"yes\",\"text\":\"\u003C$reveal state=\\\"$:/themes/tiddlywiki/vanilla/options/stickytitles\\\" type=\\\"match\\\" text=\\\"yes\\\">\\n``\\n.tc-tiddler-title {\\n\\tposition: -webkit-sticky;\\n\\tposition: -moz-sticky;\\n\\tposition: -o-sticky;\\n\\tposition: -ms-sticky;\\n\\tposition: sticky;\\n\\ttop: 0px;\\n\\tbackground: ``\u003C\u003Ccolour tiddler-background>>``;\\n\\tz-index: 500;\\n}\\n\\n``\\n\u003C$list filter=\\\"[range[100]]\\\">\\n`.tc-story-river .tc-tiddler-frame:nth-child(100n+`\u003C$text text=\u003C\u003CcurrentTiddler>>/>`) {\\nz-index: `\u003C$text text={{{ [[200]subtract\u003CcurrentTiddler>] }}}/>`;\\n}\\n`\\n\u003C/$list>\\n\u003C/$reveal>\\n\"},\"$:/themes/tiddlywiki/vanilla/themetweaks\":{\"title\":\"$:/themes/tiddlywiki/vanilla/themetweaks\",\"tags\":\"$:/tags/ControlPanel/Appearance\",\"caption\":\"{{$:/language/ThemeTweaks/ThemeTweaks}}\",\"text\":\"\\\\define lingo-base() $:/language/ThemeTweaks/\\n\\n\\\\define replacement-text()\\n[img[$(imageTitle)$]]\\n\\\\end\\n\\n\\\\define backgroundimage-dropdown()\\n\u003Cdiv class=\\\"tc-drop-down-wrapper\\\">\\n\u003C$set name=\\\"state\\\" value=\u003C\u003Cqualify \\\"$:/state/popup/themetweaks/backgroundimage\\\">>>\\n\u003C$button popup=\u003C\u003Cstate>> class=\\\"tc-btn-invisible tc-btn-dropdown\\\">{{$:/core/images/down-arrow}}\u003C/$button>\\n\u003C$reveal state=\u003C\u003Cstate>> type=\\\"popup\\\" position=\\\"belowleft\\\" text=\\\"\\\" default=\\\"\\\" class=\\\"tc-popup-keep\\\">\\n\u003Cdiv class=\\\"tc-drop-down\\\" style=\\\"text-align:center;\\\">\\n\u003C$macrocall $name=\\\"image-picker\\\" actions=\\\"\\\"\\\"\\n\\n\u003C$action-setfield\\n\\t$tiddler=\\\"$:/themes/tiddlywiki/vanilla/settings/backgroundimage\\\"\\n\\t$value=\u003C\u003CimageTitle>>\\n/>\\n\\n\u003C$action-deletetiddler $tiddler=\u003C\u003Cstate>>/>\\n\\n\\\"\\\"\\\"/>\\n\u003C/div>\\n\u003C/$reveal>\\n\u003C/$set>\\n\u003C/div>\\n\\\\end\\n\\n\\\\define backgroundimageattachment-dropdown()\\n\u003C$select tiddler=\\\"$:/themes/tiddlywiki/vanilla/settings/backgroundimageattachment\\\" default=\\\"scroll\\\">\\n\u003Coption value=\\\"scroll\\\">\u003C\u003Clingo Settings/BackgroundImageAttachment/Scroll>>\u003C/option>\\n\u003Coption value=\\\"fixed\\\">\u003C\u003Clingo Settings/BackgroundImageAttachment/Fixed>>\u003C/option>\\n\u003C/$select>\\n\\\\end\\n\\n\\\\define backgroundimagesize-dropdown()\\n\u003C$select tiddler=\\\"$:/themes/tiddlywiki/vanilla/settings/backgroundimagesize\\\" default=\\\"scroll\\\">\\n\u003Coption value=\\\"auto\\\">\u003C\u003Clingo Settings/BackgroundImageSize/Auto>>\u003C/option>\\n\u003Coption value=\\\"cover\\\">\u003C\u003Clingo Settings/BackgroundImageSize/Cover>>\u003C/option>\\n\u003Coption value=\\\"contain\\\">\u003C\u003Clingo Settings/BackgroundImageSize/Contain>>\u003C/option>\\n\u003C/$select>\\n\\\\end\\n\\n\u003C\u003Clingo ThemeTweaks/Hint>>\\n\\n! \u003C\u003Clingo Options>>\\n\\n|\u003C$link to=\\\"$:/themes/tiddlywiki/vanilla/options/sidebarlayout\\\">\u003C\u003Clingo Options/SidebarLayout>>\u003C/$link> |\u003C$select tiddler=\\\"$:/themes/tiddlywiki/vanilla/options/sidebarlayout\\\">\u003Coption value=\\\"fixed-fluid\\\">\u003C\u003Clingo Options/SidebarLayout/Fixed-Fluid>>\u003C/option>\u003Coption value=\\\"fluid-fixed\\\">\u003C\u003Clingo Options/SidebarLayout/Fluid-Fixed>>\u003C/option>\u003C/$select> |\\n|\u003C$link to=\\\"$:/themes/tiddlywiki/vanilla/options/stickytitles\\\">\u003C\u003Clingo Options/StickyTitles>>\u003C/$link>\u003Cbr>//\u003C\u003Clingo Options/StickyTitles/Hint>>// |\u003C$select tiddler=\\\"$:/themes/tiddlywiki/vanilla/options/stickytitles\\\">\u003Coption value=\\\"no\\\">{{$:/language/No}}\u003C/option>\u003Coption value=\\\"yes\\\">{{$:/language/Yes}}\u003C/option>\u003C/$select> |\\n|\u003C$link to=\\\"$:/themes/tiddlywiki/vanilla/options/codewrapping\\\">\u003C\u003Clingo Options/CodeWrapping>>\u003C/$link> |\u003C$select tiddler=\\\"$:/themes/tiddlywiki/vanilla/options/codewrapping\\\">\u003Coption value=\\\"pre\\\">{{$:/language/No}}\u003C/option>\u003Coption value=\\\"pre-wrap\\\">{{$:/language/Yes}}\u003C/option>\u003C/$select> |\\n\\n! \u003C\u003Clingo Settings>>\\n\\n|\u003C$link to=\\\"$:/themes/tiddlywiki/vanilla/settings/fontfamily\\\">\u003C\u003Clingo Settings/FontFamily>>\u003C/$link> |\u003C$edit-text tiddler=\\\"$:/themes/tiddlywiki/vanilla/settings/fontfamily\\\" default=\\\"\\\" tag=\\\"input\\\"/> | |\\n|\u003C$link to=\\\"$:/themes/tiddlywiki/vanilla/settings/codefontfamily\\\">\u003C\u003Clingo Settings/CodeFontFamily>>\u003C/$link> |\u003C$edit-text tiddler=\\\"$:/themes/tiddlywiki/vanilla/settings/codefontfamily\\\" default=\\\"\\\" tag=\\\"input\\\"/> | |\\n|\u003C$link to=\\\"$:/themes/tiddlywiki/vanilla/settings/editorfontfamily\\\">\u003C\u003Clingo Settings/EditorFontFamily>>\u003C/$link> |\u003C$edit-text tiddler=\\\"$:/themes/tiddlywiki/vanilla/settings/editorfontfamily\\\" default=\\\"\\\" tag=\\\"input\\\"/> | |\\n|\u003C$link to=\\\"$:/themes/tiddlywiki/vanilla/settings/backgroundimage\\\">\u003C\u003Clingo Settings/BackgroundImage>>\u003C/$link> |\u003C$edit-text tiddler=\\\"$:/themes/tiddlywiki/vanilla/settings/backgroundimage\\\" default=\\\"\\\" tag=\\\"input\\\"/> |\u003C\u003Cbackgroundimage-dropdown>> |\\n|\u003C$link to=\\\"$:/themes/tiddlywiki/vanilla/settings/backgroundimageattachment\\\">\u003C\u003Clingo Settings/BackgroundImageAttachment>>\u003C/$link> |\u003C\u003Cbackgroundimageattachment-dropdown>> | |\\n|\u003C$link to=\\\"$:/themes/tiddlywiki/vanilla/settings/backgroundimagesize\\\">\u003C\u003Clingo Settings/BackgroundImageSize>>\u003C/$link> |\u003C\u003Cbackgroundimagesize-dropdown>> | |\\n\\n! \u003C\u003Clingo Metrics>>\\n\\n|\u003C$link to=\\\"$:/themes/tiddlywiki/vanilla/metrics/fontsize\\\">\u003C\u003Clingo Metrics/FontSize>>\u003C/$link> |\u003C$edit-text tiddler=\\\"$:/themes/tiddlywiki/vanilla/metrics/fontsize\\\" default=\\\"\\\" tag=\\\"input\\\"/> |\\n|\u003C$link to=\\\"$:/themes/tiddlywiki/vanilla/metrics/lineheight\\\">\u003C\u003Clingo Metrics/LineHeight>>\u003C/$link> |\u003C$edit-text tiddler=\\\"$:/themes/tiddlywiki/vanilla/metrics/lineheight\\\" default=\\\"\\\" tag=\\\"input\\\"/> |\\n|\u003C$link to=\\\"$:/themes/tiddlywiki/vanilla/metrics/bodyfontsize\\\">\u003C\u003Clingo Metrics/BodyFontSize>>\u003C/$link> |\u003C$edit-text tiddler=\\\"$:/themes/tiddlywiki/vanilla/metrics/bodyfontsize\\\" default=\\\"\\\" tag=\\\"input\\\"/> |\\n|\u003C$link to=\\\"$:/themes/tiddlywiki/vanilla/metrics/bodylineheight\\\">\u003C\u003Clingo Metrics/BodyLineHeight>>\u003C/$link> |\u003C$edit-text tiddler=\\\"$:/themes/tiddlywiki/vanilla/metrics/bodylineheight\\\" default=\\\"\\\" tag=\\\"input\\\"/> |\\n|\u003C$link to=\\\"$:/themes/tiddlywiki/vanilla/metrics/storyleft\\\">\u003C\u003Clingo Metrics/StoryLeft>>\u003C/$link>\u003Cbr>//\u003C\u003Clingo Metrics/StoryLeft/Hint>>// |^\u003C$edit-text tiddler=\\\"$:/themes/tiddlywiki/vanilla/metrics/storyleft\\\" default=\\\"\\\" tag=\\\"input\\\"/> |\\n|\u003C$link to=\\\"$:/themes/tiddlywiki/vanilla/metrics/storytop\\\">\u003C\u003Clingo Metrics/StoryTop>>\u003C/$link>\u003Cbr>//\u003C\u003Clingo Metrics/StoryTop/Hint>>// |^\u003C$edit-text tiddler=\\\"$:/themes/tiddlywiki/vanilla/metrics/storytop\\\" default=\\\"\\\" tag=\\\"input\\\"/> |\\n|\u003C$link to=\\\"$:/themes/tiddlywiki/vanilla/metrics/storyright\\\">\u003C\u003Clingo Metrics/StoryRight>>\u003C/$link>\u003Cbr>//\u003C\u003Clingo Metrics/StoryRight/Hint>>// |^\u003C$edit-text tiddler=\\\"$:/themes/tiddlywiki/vanilla/metrics/storyright\\\" default=\\\"\\\" tag=\\\"input\\\"/> |\\n|\u003C$link to=\\\"$:/themes/tiddlywiki/vanilla/metrics/storywidth\\\">\u003C\u003Clingo Metrics/StoryWidth>>\u003C/$link>\u003Cbr>//\u003C\u003Clingo Metrics/StoryWidth/Hint>>// |^\u003C$edit-text tiddler=\\\"$:/themes/tiddlywiki/vanilla/metrics/storywidth\\\" default=\\\"\\\" tag=\\\"input\\\"/> |\\n|\u003C$link to=\\\"$:/themes/tiddlywiki/vanilla/metrics/tiddlerwidth\\\">\u003C\u003Clingo Metrics/TiddlerWidth>>\u003C/$link>\u003Cbr>//\u003C\u003Clingo Metrics/TiddlerWidth/Hint>>//\u003Cbr> |^\u003C$edit-text tiddler=\\\"$:/themes/tiddlywiki/vanilla/metrics/tiddlerwidth\\\" default=\\\"\\\" tag=\\\"input\\\"/> |\\n|\u003C$link to=\\\"$:/themes/tiddlywiki/vanilla/metrics/sidebarbreakpoint\\\">\u003C\u003Clingo Metrics/SidebarBreakpoint>>\u003C/$link>\u003Cbr>//\u003C\u003Clingo Metrics/SidebarBreakpoint/Hint>>// |^\u003C$edit-text tiddler=\\\"$:/themes/tiddlywiki/vanilla/metrics/sidebarbreakpoint\\\" default=\\\"\\\" tag=\\\"input\\\"/> |\\n|\u003C$link to=\\\"$:/themes/tiddlywiki/vanilla/metrics/sidebarwidth\\\">\u003C\u003Clingo Metrics/SidebarWidth>>\u003C/$link>\u003Cbr>//\u003C\u003Clingo Metrics/SidebarWidth/Hint>>// |^\u003C$edit-text tiddler=\\\"$:/themes/tiddlywiki/vanilla/metrics/sidebarwidth\\\" default=\\\"\\\" tag=\\\"input\\\"/> |\\n\"}}}"},

{"title":"$:/themes/wikilabs/roundedtabs","name":"Rounded Tabs","author":"pmario","core-version":">=5.0.0","plugin-type":"theme","description":"Segmented-control style rounded tabs","dependents":"$:/themes/tiddlywiki/snowwhite","list":"readme license history","plugin-priority":"10","version":"0.8.0","stability":"STABILITY_1_EXPERIMENTAL","type":"application/json","text":"{\"tiddlers\":{\"$:/themes/wikilabs/roundedtabs/base\":{\"title\":\"$:/themes/wikilabs/roundedtabs/base\",\"tags\":\"[[$:/tags/Stylesheet]]\",\"text\":\"\\\\rules only filteredtranscludeinline transcludeinline macrodef macrocallinline macrocallblock\\n\\n/* Segmented control tabs */\\n\\n.tc-tab-buttons {\\n\\tdisplay: inline-flex;\\n\\tflex-wrap: wrap;\\n\\tgap: 2px;\\n\\tpadding: 2px;\\n\\tbackground-color: \u003C\u003Ccolour tab-background>>;\\n\\tbackground-image: linear-gradient(rgba(128,128,128,0.12), rgba(128,128,128,0.12));\\n\\tborder-radius: 8px;\\n\\tborder: none;\\n\\tfont-size: 0.95em;\\n}\\n\\n.tc-tab-buttons button {\\n\\tbackground: transparent;\\n\\tborder: 1px solid transparent;\\n\\tborder-radius: 6px;\\n\\tpadding: 0.382em 0.618em;\\n\\tcolor: \u003C\u003Ccolour tab-foreground>>;\\n\\tborder-bottom-left-radius: 7px;\\n\\tborder-bottom-right-radius: 7px;\\n\\tmargin-right: 0;\\n}\\n\\n.tc-tab-buttons button.tc-tab-selected {\\n\\tbackground: \u003C\u003Ccolour background>>;\\n\\tcolor: \u003C\u003Ccolour foreground>>;\\n\\tfont-weight: 600;\\n\\tborder: 1px solid \u003C\u003Ccolour tab-border>>;\\n\\tbox-shadow: inset 0 0 0 1px rgba(128,128,128,0.2);\\n}\\n\\n.tc-tab-buttons button:hover:not(.tc-tab-selected) {\\n\\tbackground: rgba(128,128,128,0.2);\\n\\tcolor: \u003C\u003Ccolour foreground>>;\\n}\\n\\n.tc-tab-divider {\\n\\tborder-top: none;\\n}\\n\\n/* Sidebar overrides — vanilla's .tc-sidebar-lists rules have higher specificity */\\n\\n.tc-sidebar-lists .tc-tab-buttons {\\n\\tmargin-top: .6em;\\n}\\n\\n.tc-sidebar-lists .tc-tab-buttons button {\\n\\tbackground: transparent;\\n\\tbackground-color: transparent;\\n\\tborder: 1px solid transparent;\\n\\tcolor: \u003C\u003Ccolour tab-foreground>>;\\n}\\n\\n.tc-sidebar-lists .tc-tab-buttons button.tc-tab-selected {\\n\\tbackground: \u003C\u003Ccolour background>>;\\n\\tbackground-color: \u003C\u003Ccolour background>>;\\n\\tcolor: \u003C\u003Ccolour foreground>>;\\n\\tborder: 1px solid \u003C\u003Ccolour tab-border>>;\\n}\\n\\n.tc-sidebar-lists .tc-tab-buttons button:hover:not(.tc-tab-selected) {\\n\\tbackground: rgba(128,128,128,0.2);\\n\\tbackground-color: rgba(128,128,128,0.2);\\n\\tcolor: \u003C\u003Ccolour foreground>>;\\n}\\n\\n/* link-to-tabs offset fix */\\n.wltc-link-to-tab {\\n\\ttop: -.6em;\\n\\tleft: -1.1em;\\n\\tfont-size: 0.6em;\\n}\"},\"$:/themes/wikilabs/roundedtabs/history\":{\"title\":\"$:/themes/wikilabs/roundedtabs/history\",\"text\":\"V 0.8.0 - 2026-08-03\\n\\n* Tab buttons wrap onto a new line in narrow sidebars, instead of forcing a horizontal scrollbar\\n* More visible hover state — non-selected tabs get a subtle grey pill on hover\\n* Add version number, stability badge and this history tab\\n\\nFirst commit - 2026-05-13\\n\\n* Initial version of the theme\\n\"},\"$:/themes/wikilabs/roundedtabs/license\":{\"title\":\"$:/themes/wikilabs/roundedtabs/license\",\"license-text\":\"https://opensource.org/license/BSD-3-clause/\",\"text\":\"[[Rounded Tabs|https://wikilabs.github.io/#roundedtabs]] (c) Mario Pietsch - 2026-\u003C\u003Cnow YYYY>>\\n\\n[[https://opensource.org/license/BSD-3-clause/]]\\n\"},\"$:/themes/wikilabs/roundedtabs/readme\":{\"title\":\"$:/themes/wikilabs/roundedtabs/readme\",\"caption\":\"Rounded Tabs\",\"tags\":\"$:/tags/ControlPanel/WikiLabs\",\"text\":\"A theme that restyles the core `.tc-tab-buttons` markup as a ''segmented control'' — a rounded pill-shaped container holding the tab buttons, with the selected tab raised on the page background.\\n\\n!! Look and feel\\n\\n* Container with rounded corners (`8px`), a faint translucent overlay, and the palette's `tab-background` colour\\n* Inactive buttons are transparent with the `tab-foreground` colour\\n* The selected button sits on the page `background` colour, is bolded, and gets a 1-pixel inset highlight\\n* Sidebar tabs follow the same pattern but with sidebar-appropriate margins\\n* Includes a small offset fix for the [[link-to-tabs|$:/plugins/wikilabs/link-to-tabs]] indicator\\n\\n!! Dependencies\\n\\nDepends on `$:/themes/tiddlywiki/snowwhite` for default colours and base styling. Activate it from the Control Panel under ''Appearance → Theme''.\\n\"}}}"},
{"title":"$:/themes/wikilabs/slant-01","name":"Slant 01","author":"Mario Pietsch","core-version":">=5.1.10","version":"0.5.0","plugin-type":"theme","description":"slant-01 - an opinionated theme","dependents":"$:/themes/tiddlywiki/snowwhite $:/themes/wikilabs/underlinedtabs $:/plugins/wikilabs/info-tagmap $:/plugins/wikilabs/multicol-dropdown","list":"license readme history","type":"application/json","text":"{\"tiddlers\":{\"$:/config/ViewTemplateTagsFilters/hide\":{\"title\":\"$:/config/ViewTemplateTagsFilters/hide\",\"created\":\"20260514164505055\",\"list-before\":\"\",\"modified\":\"20260514223826307\",\"tags\":\"$:/tags/ViewTemplateTagsFilter\",\"type\":\"text/vnd.tiddlywiki\",\"text\":\"[\u003CtiddlerInfoState>get[text]!is[blank]] :filter[[$:/state/infotab/]addsuffix\u003CstoryTiddler>get[text]match[$:/wikilabs/ui/TiddlerInfo/TagMap]] :then[[ ]]\\n\"},\"$:/config/ViewToolbarButtons/Visibility/$:/core/ui/Buttons/info\":{\"title\":\"$:/config/ViewToolbarButtons/Visibility/$:/core/ui/Buttons/info\",\"created\":\"20160714085429897\",\"modified\":\"20160714085430957\",\"type\":\"text/vnd.tiddlywiki\",\"tags\":\"$:/wikilabs/ui\",\"text\":\"show\"},\"$:/themes/wikilabs/slant-01/history\":{\"title\":\"$:/themes/wikilabs/slant-01/history\",\"text\":\"V 0.5.0 2026.05.15\\n\\n* No longer deprecated. Modernised to use TW core templates as much as possible\\n* Slant look reduced to a compact title bar with controls absolutely positioned (CSS-only relative to core DOM)\\n* Subtitle (modifier + ISO modified date) is now rendered inline beside the title and wraps below when the title is long\\n* Tag pills now open the Tiddler Info panel on the Tag Map tab directly, instead of the core dropdown\\n* Standalone tag row hides while the Tag Map tab is open in the info panel, so tags are not duplicated\\n* Removed redundant overrides: ViewTemplate, ViewTemplate/controls, ViewTemplate/info, ViewTemplate/tags, $:/tags/ViewTemplate, wikilabs/macros/tabs-state\\n\\nV 0.4.0 2023.01.13\\n\\n* is still deprecated\\n* remove plugin dependency info-session, because it can be configured in TW now\\n\\nV 0.3.1 2022.08.04\\n\\n* is still deprecated\\n* update to TW v5.2.3\\n\\nV 0.3.0 2022.03.28\\n\\n* temporarily add deprecated to the version number\\n* update to TW v5.2.2\\n\\nV 0.3.0 2020.06.11\\n\\n* Fix SVG icon position in \\\"more\\\" dropdown\\n* Adjust tiddler toolbar icon positions\\n* Tag pill bottom margin made smaller\\n\\nV 0.2.1 2016.07.15\\n\\n* Initial version\\n\"},\"$:/themes/wikilabs/slant-01/license\":{\"title\":\"$:/themes/wikilabs/slant-01/license\",\"text\":\"Slant-01 Theme (c) Mario Pietsch - 2016 - \u003C\u003Cnow YYYY>>\\n\\nhttps://creativecommons.org/licenses/by-nc-sa/4.0/\"},\"$:/themes/wikilabs/slant-01/readme\":{\"title\":\"$:/themes/wikilabs/slant-01/readme\",\"text\":\"! Overview\\n\\nThis is an opinionated theme, used by pmario.\\n\\n* Compact title bar: subtitle (modifier + relative modified date) sits inline to the right of the title and wraps below when the title is long\\n* Tiddler toolbar controls float to the top right of the title row\\n* Clicking a tag pill opens the Tiddler Info panel and selects the //Tag Map// tab directly\\n\\n!! License\\n\\nCC-BY-NC-SA - {{$:/themes/wikilabs/slant-01/license}}\\n\\n''Important:'' This theme overrides the following core templates\\n\\n\u003Cul>\u003C$list filter=\\\"[[$:/themes/wikilabs/slant-01]plugintiddlers[]prefix[$:/core/]] \\\">\u003Cli>\u003C$link to=\u003C\u003CcurrentTiddler>>>\u003C\u003CcurrentTiddler>>\u003C/$link>\u003C/li>\u003C/$list>\u003C/ul>\\n\"},\"$:/themes/wikilabs/slant-01/Stylesheet\":{\"title\":\"$:/themes/wikilabs/slant-01/Stylesheet\",\"tags\":\"$:/tags/Stylesheet\",\"type\":\"text/vnd.tiddlywiki\",\"text\":\"/* slant-01: compact title row, controls floated to the top-right.\\n   Scoped to .tc-tiddler-view-frame so the EditTemplate is left alone. */\\n\\n.tc-tiddler-view-frame .tc-tiddler-title {\\n\\tposition: relative;\\n}\\n\\n.tc-tiddler-view-frame .tc-tiddler-title .tc-titlebar {\\n\\tdisplay: flex;\\n\\tflex-wrap: wrap;\\n\\talign-items: baseline;\\n\\tcolumn-gap: 1em;\\n\\trow-gap: 0.1em;\\n\\tpadding-right: 7em;\\n\\tmargin-bottom: 1em;\\n\\tfont-size: 1.1em;\\n}\\n\\n.tc-tiddler-view-frame .tc-tiddler-title > .tc-tiddler-controls {\\n\\tposition: absolute;\\n\\ttop: 0;\\n\\tright: 0;\\n\\tfont-size: 2em;\\n}\\n\\n.tc-tiddler-view-frame .tc-tiddler-title .tc-tiddler-title-icon {\\n\\tmargin-inline-end: 0.35em;\\n}\\n\\n.tc-tiddler-view-frame .tc-tiddler-title > .tc-tiddler-controls .tc-image-button {\\n\\tvertical-align: top;\\n}\\n\\n.tc-tiddler-view-frame .tc-tiddler-title > .tc-tiddler-controls .tc-drop-down .tc-image-button {\\n\\tvertical-align: unset;\\n}\\n\\n.tc-tiddler-view-frame .tc-titlebar .wltc-subtitle {\\n\\tfont-size: 0.7em;\\n\\twhite-space: nowrap;\\n}\\n\\n.tc-tiddler-view-frame .tc-tags-wrapper {\\n\\tpadding-top: 2px;\\n\\tmargin-top: -0.4em;\\n\\tmargin-bottom: 0.3em;\\n}\\n\\n.tc-tiddler-view-frame .tc-tiddler-body {\\n\\tborder-top: thin solid lightgray;\\n}\\n\\n.tc-tiddler-view-frame .tc-tiddler-info {\\n\\tpadding-right: 12px;\\n}\\n\"},\"$:/core/ui/TagTemplate\":{\"title\":\"$:/core/ui/TagTemplate\",\"text\":\"\\\\whitespace trim\\n\u003Cspan class=\\\"tc-tag-list-item\\\" data-tag-title=\u003C\u003CcurrentTiddler>>>\\n\\t\u003C$let tabState={{{ [[$:/state/infotab/]addsuffix\u003CstoryTiddler>] }}}>\\n\\t\\t\u003C$macrocall $name=\\\"tag-pill-body\\\"\\n\\t\\t\\ttag=\u003C\u003CcurrentTiddler>>\\n\\t\\t\\ticon={{{ [\u003CcurrentTiddler>] :cascade[all[shadows+tiddlers]tag[$:/tags/TiddlerIconFilter]!is[draft]get[text]] }}}\\n\\t\\t\\tcolour={{{ [\u003CcurrentTiddler>] :cascade[all[shadows+tiddlers]tag[$:/tags/TiddlerColourFilter]!is[draft]get[text]] }}}\\n\\t\\t\\tpalette={{$:/palette}}\\n\\t\\t\\telement-tag=\\\"$button\\\"\\n\\t\\t\\telement-attributes=\\\"\\\"\\\"tag='span'\\\"\\\"\\\"\\n\\t\\t\\tactions=\\\"\\\"\\\"\u003C$action-setfield $tiddler=\u003C\u003CtiddlerInfoState>> text=\\\"yes\\\"/>\u003C$action-setfield $tiddler=\u003C\u003CtabState>> text=\\\"$:/wikilabs/ui/TiddlerInfo/TagMap\\\"/>\\\"\\\"\\\"\\n\\t\\t/>\\n\\t\u003C/$let>\\n\u003C/span>\\n\"},\"$:/core/ui/TiddlerInfo\":{\"title\":\"$:/core/ui/TiddlerInfo\",\"text\":\"\\\\whitespace trim\\n\u003Cdiv style=\\\"position:relative;\\\">\\n\u003Cdiv class=\\\"tc-tiddler-controls tc-tiddler-info-controls\\\">\\n\u003C$reveal state=\\\"$:/config/TiddlerInfo/Mode\\\" type=\\\"match\\\" text=\\\"sticky\\\">\\n\u003C$button set=\u003C\u003CtiddlerInfoState>> setTo=\\\"\\\" tooltip={{$:/language/Buttons/Info/Hint}} aria-label={{$:/language/Buttons/Info/Caption}} class=\\\"tc-btn-invisible\\\">\\n{{$:/core/images/close-button}}\\n\u003C/$button>\\n\u003C/$reveal>\\n\u003C/div>\\n\u003C/div>\\n\\n\u003C$let tabState={{{ [[$:/state/infotab/]addsuffix\u003CstoryTiddler>] }}}>\\n\u003C$macrocall $name=\\\"tabs\\\" tabsList=\\\"[all[shadows+tiddlers]tag[$:/tags/TiddlerInfo]!has[draft.of]]\\\" default={{$:/config/TiddlerInfo/Default}} explicitState=\u003C\u003CtabState>>/>\\n\u003C/$let>\\n\\n\"},\"$:/core/ui/ViewTemplate/subtitle\":{\"title\":\"$:/core/ui/ViewTemplate/subtitle\"},\"$:/core/ui/ViewTemplate/title\":{\"title\":\"$:/core/ui/ViewTemplate/title\",\"tags\":\"$:/tags/ViewTemplate\",\"text\":\"\\\\whitespace trim\\n\\\\define title-styles() fill:$(foregroundColor)$;\\n\\n\u003Cdiv class=\\\"tc-tiddler-title tc-clearfix\\\">\\n\\t\u003Cspan class=\\\"tc-tiddler-controls\\\">\\n\\t\\t\u003C$list filter=\\\"[all[shadows+tiddlers]tag[$:/tags/ViewToolbar]!has[draft.of]] :filter[lookup[$:/config/ViewToolbarButtons/Visibility/]!match[hide]]\\\"\\n\\t\\t\\tstoryview=\\\"pop\\\"\\n\\t\\t\\tvariable=\\\"listItem\\\"\\n\\t\\t>\\n\\t\\t\\t\u003C$let condition={{{ [\u003ClistItem>get[condition]] }}}>\\n\\t\\t\\t\\t\u003C%if [\u003Ccondition>!is[blank]] :and[\u003CcurrentTiddler>subfilter\u003Ccondition>limit[1]] :else[\u003Ccondition>is[blank]then[true]] %>\\n\\t\\t\\t\\t\\t\u003C$set name=\\\"tv-config-toolbar-class\\\" filter=\\\"[\u003Ctv-config-toolbar-class>] [\u003ClistItem>encodeuricomponent[]addprefix[tc-btn-]]\\\">\\n\\t\\t\\t\\t\\t\\t\u003C$transclude tiddler=\u003C\u003ClistItem>>/>\\n\\t\\t\\t\\t\\t\u003C/$set>\\n\\t\\t\\t\\t\u003C%endif%>\\n\\t\\t\\t\u003C/$let>\\n\\t\\t\u003C/$list>\\n\\t\u003C/span>\\n\\t\u003Cdiv class=\\\"tc-titlebar\\\">\\n\\t\\t\u003C$set name=\\\"tv-wikilinks\\\" value={{$:/config/Tiddlers/TitleLinks}}>\\n\\t\\t\\t\u003C$link>\\n\\t\\t\\t\\t\u003C$list filter=\\\"[\u003CcurrentTiddler>] :cascade[all[shadows+tiddlers]tag[$:/tags/TiddlerIconFilter]!is[draft]get[text]] +[!is[blank]]\\\" variable=\\\"ignore\\\">\\n\\t\\t\\t\\t\\t\u003C$let foregroundColor={{{ [\u003CcurrentTiddler>] :cascade[all[shadows+tiddlers]tag[$:/tags/TiddlerColourFilter]!is[draft]get[text]] }}}>\\n\\t\\t\\t\\t\\t\\t\u003Cspan class=\\\"tc-tiddler-title-icon\\\" style=\u003C\u003Ctitle-styles>>>\\n\\t\\t\\t\\t\\t\\t\\t{{||$:/core/ui/TiddlerIcon}}\\n\\t\\t\\t\\t\\t\\t\u003C/span>\\n\\t\\t\\t\\t\\t\u003C/$let>\\n\\t\\t\\t\\t\u003C/$list>\\n\\t\\t\\t\\t\u003C$transclude tiddler={{{ [\u003CcurrentTiddler>] :cascade[all[shadows+tiddlers]tag[$:/tags/ViewTemplateTitleFilter]!is[draft]get[text]] :and[!is[blank]else[$:/core/ui/ViewTemplate/title/default]] }}}/>\\n\\t\\t\\t\u003C/$link>\\n\\t\\t\u003C/$set>\\n\\t\\t\u003Cspan class=\\\"tc-subtitle wltc-subtitle\\\">\\n\\t\\t\\t\u003C$link to={{!!modifier}}>\u003C$view field=\\\"modifier\\\"/>\u003C/$link> \u003C$view field=\\\"modified\\\" format=\\\"date\\\" template=\\\"YYYY-0MM-0DD\\\"/>\\n\\t\\t\u003C/span>\\n\\t\u003C/div>\\n\\t\u003C$reveal tag=\\\"div\\\" type=\\\"nomatch\\\" text=\\\"\\\" default=\\\"\\\" state=\u003C\u003CtiddlerInfoState>> class=\\\"tc-tiddler-info tc-popup-handle\\\" animate=\\\"yes\\\" retain=\\\"yes\\\">\\n\\t\\t\u003C$list filter=\\\"[all[shadows+tiddlers]tag[$:/tags/TiddlerInfoSegment]!has[draft.of]] [[$:/core/ui/TiddlerInfo]]\\\" variable=\\\"listItem\\\">\\n\\t\\t\\t\u003C$transclude tiddler=\u003C\u003ClistItem>> mode=\\\"block\\\"/>\\n\\t\\t\u003C/$list>\\n\\t\u003C/$reveal>\\n\u003C/div>\\n\\n\"}}}"},
{"title":"$:/themes/wikilabs/underlinedtabs","name":"Underlined Tabs","author":"pmario","core-version":">=5.0.0","plugin-type":"theme","description":"Segmented-control style underlined tabs","dependents":"$:/themes/tiddlywiki/snowwhite $:/plugins/wikilabs/new-style","list":"readme license history","plugin-priority":"10","version":"0.8.0","stability":"STABILITY_1_EXPERIMENTAL","type":"application/json","text":"{\"tiddlers\":{\"$:/themes/wikilabs/underlinedtabs/base\":{\"title\":\"$:/themes/wikilabs/underlinedtabs/base\",\"tags\":\"[[$:/tags/Stylesheet]]\",\"text\":\"\\\\rules only filteredtranscludeinline transcludeinline macrodef macrocallinline macrocallblock\\n\\n/* Underlined tabs — flat buttons with a coloured underline on the selected tab */\\n\\n@keyframes tc-underlinedtabs-first-slide-in {\\n\\tfrom { padding-left: 0; }\\n}\\n\\n@keyframes tc-underlinedtabs-first-slide-out {\\n\\tfrom { padding-left: 8px; }\\n}\\n\\n.tc-tab-buttons {\\n\\tdisplay: flex;\\n\\tflex-wrap: wrap;\\n\\tgap: 0;\\n\\tpadding: 0;\\n\\tbackground: transparent;\\n\\tborder: none;\\n\\tborder-bottom: none;\\n\\tborder-radius: 0;\\n\\tfont-size: 1em;\\n}\\n\\n.tc-tab-buttons button {\\n\\tbackground: transparent;\\n\\tborder: none;\\n\\tborder-bottom: 2px solid transparent;\\n\\tborder-radius: 0;\\n\\tpadding: 4px 8px;\\n\\tmargin-right: 8px;\\n\\tmargin-bottom: -1px;\\n\\tcolor: \u003C\u003Ccolour tab-foreground>>;\\n\\tfont-weight: normal;\\n}\\n\\n.tc-tab-buttons button.tc-tab-selected {\\n\\tbackground: transparent;\\n\\tcolor: \u003C\u003Ccolour foreground>>;\\n\\tfont-weight: 600;\\n\\tborder: none;\\n\\tborder-bottom: 2px solid \u003C\u003Ccolour primary>>;\\n}\\n\\n.tc-tab-buttons button:hover:not(.tc-tab-selected) {\\n\\tbackground: transparent;\\n\\tcolor: \u003C\u003Ccolour foreground>>;\\n\\tborder-bottom-color: \u003C\u003Ccolour muted-foreground>>;\\n}\\n\\n.tc-tab-buttons button:first-child:not(.tc-tab-selected) {\\n\\tpadding-left: 0;\\n}\\n\\n.tc-tab-buttons button.tc-uit-anim-in {\\n\\tanimation: tc-underlinedtabs-first-slide-in 200ms ease-out;\\n}\\n\\n.tc-tab-buttons button.tc-uit-anim-out {\\n\\tanimation: tc-underlinedtabs-first-slide-out 300ms ease-out;\\n}\\n\\n.tc-tab-divider {\\n\\t\u003C!-- Devider needed for control panel nested tabs -->\\n\\t\u003C!-- display: none; -->\\n}\\n\\n/* Sidebar overrides — vanilla's .tc-sidebar-lists rules have higher specificity */\\n\\n.tc-sidebar-lists .tc-tab-buttons {\\n\\tmargin-top: 1em;\\n}\\n\\n.tc-sidebar-lists .tc-tab-buttons button {\\n\\tbackground: transparent;\\n\\tbackground-color: transparent;\\n\\tborder: none;\\n\\tborder-bottom: 2px solid transparent;\\n\\tcolor: \u003C\u003Ccolour tab-foreground>>;\\n\\tpadding: 6px 4px 4px;\\n\\tmargin-right: 4px;\\n}\\n\\n.tc-sidebar-lists .tc-tab-buttons button.tc-tab-selected {\\n\\tbackground: transparent;\\n\\tbackground-color: transparent;\\n\\tborder: none;\\n\\tborder-bottom: 2px solid \u003C\u003Ccolour primary>>;\\n\\tcolor: \u003C\u003Ccolour foreground>>;\\n}\\n\\n.tc-sidebar-lists .tc-tab-buttons button:hover:not(.tc-tab-selected) {\\n\\tbackground: transparent;\\n\\tbackground-color: transparent;\\n\\tcolor: \u003C\u003Ccolour foreground>>;\\n\\tborder-bottom-color: \u003C\u003Ccolour muted-foreground>>;\\n}\\n\\n/* link-to-tabs offset fix */\\n.wltc-link-to-tab {\\n\\ttop: -.4em;\\n\\tleft: -1.1em;\\n\\tfont-size: 0.55em;\\n}\"},\"$:/themes/wikilabs/underlinedtabs/history\":{\"title\":\"$:/themes/wikilabs/underlinedtabs/history\",\"text\":\"V 0.8.0 - 2026-08-03\\n\\n* Tab buttons wrap onto a new line in narrow sidebars, instead of forcing a horizontal scrollbar\\n* Add version number, stability badge and this history tab\\n\\nFirst commit - 2026-05-13\\n\\n* Initial version of the theme\\n\"},\"$:/themes/wikilabs/underlinedtabs/license\":{\"title\":\"$:/themes/wikilabs/underlinedtabs/license\",\"license-text\":\"https://opensource.org/license/BSD-3-clause/\",\"text\":\"[[Underlined Tabs|https://wikilabs.github.io/#underlinedtabs]] (c) Mario Pietsch - 2026-\u003C\u003Cnow YYYY>>\\n\\n[[https://opensource.org/license/BSD-3-clause/]]\\n\"},\"$:/themes/wikilabs/underlinedtabs/readme\":{\"title\":\"$:/themes/wikilabs/underlinedtabs/readme\",\"caption\":\"Underlined Tabs\",\"tags\":\"$:/tags/ControlPanel/WikiLabs\",\"text\":\"A theme that restyles the core `.tc-tab-buttons` markup as flat tab buttons over the page background, with the selected tab marked by a 2-pixel coloured underline.\\n\\n!! Look and feel\\n\\n* Flat tab buttons, no container background, no border\\n* The selected button is bolded and gets a 2-pixel underline in the palette's `primary` colour\\n* Hovering over an inactive tab shows a muted underline\\n* The first tab sits flush with the left edge when not selected\\n* Sidebar tabs follow the same pattern with sidebar-appropriate spacing\\n* Includes a small offset fix for the [[link-to-tabs|$:/plugins/wikilabs/link-to-tabs]] indicator\\n\\n!! Optional first-tab animation\\n\\nWhen the first tab's selected state changes, an optional slide-in / slide-out animation can be played. The matching keyframes (`tc-underlinedtabs-first-slide-in` and `tc-underlinedtabs-first-slide-out`) ship with this theme; the JavaScript that adds the trigger classes lives in the [[New Style|$:/plugins/wikilabs/new-style]] plugin. Install that plugin alongside this theme to enable the animation. Without it the theme still works — there is just no animation.\\n\\n!! Dependencies\\n\\nDepends on `$:/themes/tiddlywiki/snowwhite` for default colours and base styling, and optionally on `$:/plugins/wikilabs/new-style` for the first-tab animation. Activate it from the Control Panel under ''Appearance → Theme''.\\n\"}}}"},

{"title":"custom-markup","created":"20201226173051333","description":"This plugin can be used to apply new wikitext formatting to content. It allows you to improve the writing speed","forum":"https://talk.tiddlywiki.org/t/intro-the-custom-markup-plugin-beta/1219","git-issues":"https://github.com/wikilabs/plugins/issues","git-repo":"https://github.com/wikilabs/plugins/tree/master/wikilabs/custom-markup","modified":"20220422110032407","tags":"Wikitex-Extensions Editor Advanced-Tools EXPERIMENTAL WikiText $:/tags/Link","type":"text/vnd.tiddlywiki","url":"https://wikilabs.github.io/editions/custom-markup","text":"! Custom Markup Plugin\n\nThis plugin can be used to apply new wikitext formatting to content, that is imported (copy / pasted) from other sites. It allows you to improve the writing speed and it improves plain text readability.\n\nThis is a \"power-user tool\"!"},

{"title":"GettingStarted","created":"20190211002748002","modified":"20231218155012524","type":"text/vnd.tiddlywiki","text":"\u003Cstyle>\n.tc-thumbnail-icon {border:black 1px solid;}\n\u003C/style>\n\n! Welcome\n\nWelcome at [[WikiLabs|wikilabs.github.io]] ... with many useful ~TiddlyWiki ''editions'' , my personal ''themes'' and ''plugins''.\n\nDevelopment repositories can be found at GitHub\n\n! Library Configuration \n\n!! Latest Library Link\n\n''Drag / Import the following link into your wiki, to import the configuration tiddler!''\n\n\u003C$link class=\"tc-btn-big-green\" to=\"$:/config/wikilabs/PluginLibraryWL/latest\">\n~WikiLabs Plugin Configuration\n\u003C/$link>\n\n!! Video\n\nA short info video about how to use the \"~WikiLabs Plugin Configuration\" link shown above.\n\n\u003Cdiv style=\"font-size:0.8em;margin-top:2em;margin-bottom:2em;\">\n{{VideoThumbnail - Use the Library Configuration}}\n\u003C/div>\n\n! Plugin Details\n\nDetails can be found at: \u003C$link class=\"wltc-btn-big-blue\" to=\"Details\">Show Editions, Themes and Plugins\u003C/$link>\n\n----\n\n\u003Cdetails>\u003Csummary>OLD -- Compatible with TW v5.3.1 and down\u003C/summary>\n\u003Cp>\nImport the following link, if you want to install a stable version which is compatible with ~TiddlyWiki version v5.3.1 down to v5.2.7\n\u003C/p>\n\u003Cp>\n[[WikiLabs Plugin Configuration 5.3.1|$:/config/wikilabs/PluginLibraryWL/5.3.1]]\n\u003C/p>\n\u003C/details>\n\n\u003Cdetails>\u003Csummary>OLD -- Compatible with TW v5.2.7 and down\u003C/summary>\n\u003Cp>\nImport the following link, if you want to install a stable version which is compatible with ~TiddlyWiki version v5.2.7 down to v5.1.23\n\u003C/p>\n\u003Cp>\n[[WikiLabs Plugin Configuration 5.2.7|$:/config/wikilabs/PluginLibraryWL/5.2.7]]\n\u003C/p>\n\u003C/details>\n\n\u003Cdetails>\u003Csummary>OLD -- Compatible with TW v5.1.23 and down\u003C/summary>\n\u003Cp>\nImport the following link, if you want to install a stable version which is compatible with ~TiddlyWiki version 5.1.22 and 5.1.23!!\n\u003C/p>\n\u003Cp>\n[[WikiLabs Plugin Configuration 5.1.23|$:/config/wikilabs/PluginLibraryWL/5.1.23]]\n\u003C/p>\n\u003C/details>\n\n\u003Cdetails>\u003Csummary>OLD -- Compatible with TW v5.1.21 and down\u003C/summary>\n\u003Cp>\nImport the following link, if you want to install a stable version which is compatible with ~TiddlyWiki version \u003C= 5.1.21!!\n\u003C/p>\n\u003Cp>\n[[WikiLabs Plugin Configuration \u003C= 5.1.21|$:/config/wikilabs/PluginLibraryWL/5.1.21]]\n\u003C/p>\n\u003C/details>"},

{"title":"pragma-comment","created":"20201226173504500","description":"This plugin allows developers to add comments outside of \"macro definitions\"","forum":"TODO","git-issues":"https://github.com/wikilabs/plugins/issues","git-repo":"https://github.com/wikilabs/plugins/tree/master/wikilabs/pragma-comment","modified":"20260515072926023","tags":"$:/tags/Link Development Editor Advanced-Tools WikiText Wikitex-Extensions DEPRECATED","type":"text/vnd.tiddlywiki","url":"https://wikilabs.github.io/editions/pragma-comment","text":"! Deprecated\n\nA similar function is part of the TW core since V5.2.0 See: https://tiddlywiki.com/#HTML%20in%20WikiText : ''Pragma Comments''\n\n! Pragma Comment\n\nThis plugin allows developers to add comments outside of \"macro definitions\", so they don't waste any time during execution. This is _not_ possible with the default wikitext\n\n```\n\\\\ comment comes here till the end of the line\n\\define test() Hello World\n```\n\n"},

{"title":"rounded-tabs","created":"20260515074301783","description":"Segmented-control style rounded tabs","forum":"TODO","git-issues":"https://github.com/wikilabs/plugins/issues","git-repo":"https://github.com/wikilabs/plugins/tree/master/wikilabs/rounded-tabs","modified":"20260515075049817","tags":"plugin UI $:/tags/Link theme Tabs","type":"text/vnd.tiddlywiki","url":"https://wikilabs.github.io/","text":"! Rounded Tabs\n\nA theme that restyles the core `.tc-tab-buttons` markup as a ''segmented control'' — a rounded pill-shaped container holding the tab buttons, with the selected tab raised on the page background.\n"},

{"title":"script-manager","created":"20171215212502872","description":"This edition is very handy to collect links to different topics","forum":"TODO","git-issues":"https://github.com/wikilabs/plugins/issues","git-repo":"https://github.com/wikilabs/plugins/tree/master/wikilabs/script-manager","modified":"20230702102323837","tags":"edition $:/tags/Link HowTo WikiText Development","type":"text/vnd.tiddlywiki","url":"https://wikilabs.github.io/editions/script-manager","text":"! Script Manager Edition\n\nThis edition was mainly created to support a video series, that shows, how the edition was created: ''Step by Step''\n\nI do use a sightly \"pimped\" version as my day to day link and idea manager. \n\n"},
{"title":"scroll-memory","created":"20260804164235308","description":"Scroll position memory and click landmarks for long tiddlers","forum":"TODO","git-issues":"https://github.com/wikilabs/plugins/issues","git-repo":"https://github.com/wikilabs/plugins/tree/master/wikilabs/scroll-memory","modified":"20260804164935314","tags":"plugin $:/tags/Link Navigation Scrolling Reading Editing","type":"text/vnd.tiddlywiki","url":"https://wikilabs.github.io/editions/scroll-memory","text":"! Scroll Memory -- never lose your place\n\nLong tiddlers cost you your place: you follow a link, come back, and have to hunt for the sentence you left. Scroll Memory remembers how deep you were reading, and records a landmark whenever you follow a link out of a long tiddler. A floating button returns you to the exact view you had, with the clicked link blinking to mark the spot. Closing a tiddler that a link opened brings you back automatically, and while you are editing a toggle steps between your open drafts and the last landmark, so you can read a source and write about it side by side.\n"},

{"title":"theme-slant-01","caption":"slant-01","created":"20170203113430786","description":"This is an opinionated TiddlyWiki Theme designed for my personal use","git-repo":"https://github.com/wikilabs/themes/tree/master/wikilabs/slant-01","modified":"20211004085643708","tags":"theme","type":"text/vnd.tiddlywiki","url":"https://wikilabs.github.io/editions/slant-01","text":"Slant is a theme, that also includes several plugins. So if you want to use the theme, you should import it, using the ~TiddlyWiki plugin-library import mechanism. \n\n''Drag the following link into your wiki, to import the configuration tiddler!''\n\n\u003Cspan class=\"tc-btn-big-green\">\n[[WikiLabs Plugin Configuration|$:/config/wikilabs/PluginLibraryWL/latest]]\n\u003C/span>\n\n"},

{"title":"trails","created":"20230825081033089","description":"Breadcrumbs & Trails -- Visualize your Context Structure","forum":"TODO","git-issues":"https://github.com/wikilabs/plugins/issues","git-repo":"https://github.com/wikilabs/plugins/tree/master/wikilabs/trails","modified":"20230825081350554","tags":"plugin $:/tags/Link TOC Table-of-Contents Outline Linking Navigation Editor Breadcrumbs Trails","type":"text/vnd.tiddlywiki","url":"https://wikilabs.github.io/editions/trails","text":"! trails -- Breadcrumbs & Trails -- Visualize your Context\n\nBreadcrumbs and Trails are used as a navigational aid in user interfaces and on web pages. It allows users to keep track and maintain awareness of their locations within programs, documents, or websites."},
{"title":"trigger","created":"20191101121318449","description":"This plugin allows you have mouse \"click animations\"","forum":"TODO","git-issues":"https://github.com/wikilabs/plugins/issues","git-repo":"https://github.com/wikilabs/plugins/tree/master/wikilabs/trigger","modified":"20220422105947294","tags":"EXPERIMENTAL Advanced-Tools Development $:/tags/Link","type":"text/vnd.tiddlywiki","url":"https://wikilabs.github.io/editions/trigger/","text":"!! Backup\n\nIf you use the `\u003C$trigger>` widget, with variables defined in the wrong way, it has the potential to \"brick\" your wiki!\n\nSo having ''backups'' is extremely important!\n\nThis plugin allows you have mouse \"click animations\""},
{"title":"trim-whitespace","created":"20230505100258343","description":"This plugin adds a new editor toolbar button, that allows you to trim whitespace from a selected text area","forum":"https://talk.tiddlywiki.org/t/intro-trim-whitespace-plugin-edit-toolbar-button/6925","git-issues":"https://github.com/wikilabs/plugins/issues","git-repo":"https://github.com/wikilabs/plugins/tree/master/wikilabs/trim-whitespace","modified":"20230505105742483","tags":"$:/tags/Link Tools Editor plugin","type":"text/vnd.tiddlywiki","url":"https://wikilabs.github.io/editions/trim-whitespace","text":"! Whitespave Trim (Editor toolbar button)\n\nThis plugin adds a new editor toolbar button, that allows you to trim whitespace from a selected text area"},
{"title":"tw-mcp","created":"20260404141725864","description":"Connects AI assistants to TiddlyWiki via the Model Context Protocol","forum":"TODO","git-issues":"https://github.com/wikilabs/plugins/issues","git-repo":"https://github.com/wikilabs/plugins/tree/master/wikilabs/tw-mcp","modified":"20260404143102143","tags":"plugin $:/tags/Link Development mcp llm","type":"text/vnd.tiddlywiki","url":"https://wikilabs.github.io/editions/tw-mcp","text":"! MCP Server Plugin\n\nThe TW MCP plugin turns any TiddlyWiki into an AI-accessible knowledge base. It lets Claude, Gemini, and other AI assistants read, search, render, and edit your wiki through a standardised protocol. With built-in safety features, proxy mode for multi-client access, and hashline edits for token-efficient conflict-free editing, it bridges the gap between personal wikis and AI workflows."},

{"title":"uuidv7","created":"20260326220604071","modified":"20260326221241650","description":"This plugin allows you to assign a UUIDv7 to the c7 field and a ULID-like value to a c32 field","forum":"","git-issues":"https://github.com/wikilabs/plugins/issues","git-repo":"https://github.com/wikilabs/plugins/tree/master/wikilabs/uuid7","tags":"Advanced-Tools EXPERIMENTAL $:/tags/Link UUIDv7","type":"text/vnd.tiddlywiki","url":"https://wikilabs.github.io/editions/uuid7","text":"! UUID v7 Plugin\n\n''This is for experiments only. It's not sure, that all functions are kept in the plugin''\n\nWith this plugin, if you create a new tiddler\n\n* Open the fields editor — notice the c32 field with a value like 01KMNH-72WK-FM8S1A277T55-S8DK\n* The c32 badge at the bottom-right shows the value with its check symbol\n* The phrase badge at the bottom-left shows its mnemonic encoding\n"},
